<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06090f">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;font-family:Arial,"Noto Sans Arabic",sans-serif;color:#eef7fb;background:#06090f}button,textarea{font:inherit}button{border:0;cursor:pointer}.screen{min-height:100vh;position:relative;overflow:hidden}.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,#16404d38,transparent 32%),radial-gradient(circle at 15% 85%,#b88b3220,transparent 30%);pointer-events:none}.entry{display:grid;place-items:center;padding:24px}.entry-panel{position:relative;z-index:1;width:min(760px,100%);padding:56px 42px;border:1px solid #7de4ff18;border-radius:30px;background:linear-gradient(145deg,#101923ed,#0a1018e8);box-shadow:0 30px 100px #0008;backdrop-filter:blur(24px)}.entry-kicker{display:flex;align-items:center;gap:10px;color:#70dff5;font-size:11px;letter-spacing:4px;font-weight:800}.entry-kicker span{width:34px;height:1px;background:#70dff555}.entry h1{margin:25px 0 10px;font-size:clamp(38px,7vw,68px);letter-spacing:-2px}.entry p{max-width:650px;margin:0;color:#93a8b3;line-height:1.9;font-size:14px}.primary{margin-top:28px;padding:14px 22px;border-radius:15px;background:#e2b957;color:#10141a;font-weight:900}.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px;color:#617984;font-size:8px;letter-spacing:1.5px}.app{background:#06090f}.top{height:64px;position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #7de4ff12;background:#080d14d9;backdrop-filter:blur(18px)}.brand strong,.brand span{display:block}.brand strong{font-size:19px;letter-spacing:2px}.brand span{margin-top:3px;color:#627b87;font-size:8px;letter-spacing:1.5px}.actions{display:flex;align-items:center;gap:8px;color:#718892;font-size:10px}.dot{width:7px;height:7px;border-radius:50%;background:#57d49a;box-shadow:0 0 14px #57d49a88}.actions button{width:34px;height:34px;margin-right:8px;border-radius:11px;background:#101923;color:#9ab0ba}.shell{position:relative;z-index:1;display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;min-height:calc(100vh - 64px);padding:10px}.nav{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid #7de4ff14;border-radius:22px;background:#0b1119d9;backdrop-filter:blur(20px)}.nav-title{padding:5px 10px 12px;color:#536a75;font-size:8px;letter-spacing:2px}.nav button{display:flex;align-items:center;gap:11px;padding:12px 11px;border-radius:13px;background:transparent;color:#7f949e;text-align:right;font-size:12px}.nav button.active{background:#6bdff50d;color:#70dff5;border:1px solid #70dff515}.icon{width:7px;height:7px;border:1px solid currentColor;border-radius:2px}.nav-foot{margin-top:auto;padding:12px 9px;border-top:1px solid #7de4ff0e;color:#506671;font-size:8px}.content{min-width:0;display:flex;flex-direction:column;gap:14px;overflow:auto;padding:4px}.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px;border:1px solid #7de4ff14;border-radius:24px;background:linear-gradient(135deg,#101923ed,#0a1018e5);box-shadow:0 20px 60px #0005}.eyebrow{color:#6bdff5;font-size:8px;letter-spacing:2px}.hero h2{margin:8px 0;font-size:30px}.hero p{margin:0;max-width:720px;color:#8198a3;font-size:12px;line-height:1.8}.mark{min-width:82px;text-align:center;padding:14px;border-right:1px solid #7de4ff22}.mark b{display:block;color:#e2b957;font-size:28px;letter-spacing:3px}.mark small{color:#617983;font-size:7px;letter-spacing:2px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.card{position:relative;min-height:170px;padding:24px;text-align:right;border:1px solid #7de4ff13;border-radius:22px;background:#0c141dd9;color:#eaf6fa}.main{grid-row:span 2;min-height:354px;background:linear-gradient(145deg,#11202a,#0b121a)}.label{color:#6bdff5;font-size:8px;letter-spacing:2px}.card h3{margin:18px 0 8px;font-size:20px}.card p{margin:0;color:#8197a2;font-size:11px;line-height:1.8}.arrow{position:absolute;left:24px;bottom:22px;color:#e2b957;font-size:18px}.panel{min-height:430px;border:1px solid #7de4ff14;border-radius:24px;background:#0b121ad9;display:flex;flex-direction:column;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid #7de4ff10;color:#63d79e;font-size:9px}.panel-head small{color:#506872;font-size:8px}.messages{flex:1;min-height:280px;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:9px}.msg{max-width:85%;padding:12px 14px;border-radius:14px;font-size:11px;line-height:1.8}.user{align-self:flex-start;background:#17313a;color:#dcecf1}.ai{align-self:flex-end;background:#121b25;border:1px solid #7de4ff12;color:#9fb3bc}.empty{margin:auto;color:#687f8a;text-align:center;display:flex;flex-direction:column;gap:6px}.empty b{font-size:20px}.composer{display:flex;gap:8px;padding:14px;border-top:1px solid #7de4ff10}.composer textarea{flex:1;min-height:54px;max-height:160px;resize:vertical;background:#070d13;border:1px solid #7de4ff14;border-radius:14px;color:#eaf6fa;padding:12px;outline:0}.composer button{padding:0 20px;border-radius:14px;background:#e2b957;color:#11161b;font-weight:900}.module{min-height:430px;padding:30px;border:1px solid #7de4ff14;border-radius:24px;background:#0b121ad9}.module h3{margin:0;font-size:22px}.line{width:70px;height:2px;margin:15px 0;background:#70dff5}.module p{color:#8197a2;font-size:12px;line-height:1.9}.state{margin-top:260px;padding:12px;border-radius:12px;background:#071017;color:#55707b;font-size:8px;letter-spacing:1px}@media(max-width:800px){.shell{grid-template-columns:1fr}.nav{flex-direction:row;overflow-x:auto;order:2}.nav-title,.nav-foot{display:none}.nav button{white-space:nowrap}.content{order:1}.grid{grid-template-columns:1fr}.main{grid-row:auto;min-height:240px}.hero{padding:20px}.mark{min-width:70px}}@media(max-width:520px){.mark{display:none}.hero h2{font-size:28px}.panel-head small{display:none}.composer{flex-direction:column}.composer button{height:46px}.entry-panel{padding:38px 24px}.actions span:not(.dot){display:none}}
</style>
</head><body>
<section id="entry" class="screen entry"><div class="entry-panel"><div class="entry-kicker"><span></span> AMAR AI <span></span></div><h1>ذكاء يعمل معك.</h1><p>مساحة Agent حديثة وهادئة، مبنية حول المحادثة والعمل والبحث، مع تجربة واضحة وخالية من التشتيت.</p><button class="primary" onclick="enterApp()">الدخول إلى AMAR AI <b>←</b></button><div class="meta"><span>AGENT WORKSPACE</span><span>FAIL-CLOSED</span><span>NO AUTO-EXECUTION</span></div></div></section>
<section id="app" class="screen app" style="display:none"><header class="top"><div class="brand"><strong>AMAR AI</strong><span>INTELLIGENCE WORKSPACE</span></div><div class="actions"><span class="dot"></span><span id="status">النظام جاهز</span><button onclick="setView('settings')">⚙</button></div></header><div class="shell"><aside class="nav"><div class="nav-title">المساحة</div><button class="active" data-view="home" onclick="setView('home')"><i class="icon"></i>الرئيسية</button><button data-view="assistant" onclick="setView('assistant')"><i class="icon"></i>الإيجنت</button><button data-view="research" onclick="setView('research')"><i class="icon"></i>البحث</button><button data-view="workspace" onclick="setView('workspace')"><i class="icon"></i>مساحة العمل</button><button data-view="files" onclick="setView('files')"><i class="icon"></i>الملفات</button><button data-view="memory" onclick="setView('memory')"><i class="icon"></i>الذاكرة</button><button data-view="settings" onclick="setView('settings')"><i class="icon"></i>الإعدادات</button><div class="nav-foot"><span class="dot"></span> طبقة العرض فقط</div></aside><main id="content" class="content"></main></div></section>
<script>
const copy={home:['AMAR AI · HOME','مركز الذكاء','واجهة موحّدة ونظيفة للوصول إلى قدرات AMAR AI دون عناصر زخرفية مشتتة.'],assistant:['AMAR AI · AGENT','الإيجنت','المحادثة والتحليل هنا؛ سلطة القرار والتنفيذ تبقى خارج طبقة العرض.'],research:['AMAR AI · RESEARCH','البحث والتحقق','مسار مخصص للبحث، جمع الأدلة، والتحقق قبل عرض النتيجة.'],workspace:['AMAR AI · WORKSPACE','مساحة العمل','مكان منظم للملفات والنتائج والمخرجات المرتبطة بالمهمة.'],files:['AMAR AI · FILES','الملفات','إدارة الملفات دون تنفيذ تلقائي؛ الرفع والتخزين منفصلان عن التنفيذ.'],memory:['AMAR AI · MEMORY','الذاكرة','عرض الذاكرة المؤكدة فقط، دون اختلاق بيانات أو ادعاء تذكّر غير موجود.'],settings:['AMAR AI · SETTINGS','الإعدادات','تخصيص مظهر الواجهة وسلوك العرض دون تغيير عقود المحرك.']};
let view='home',messages=[],agentBusy=false;
function enterApp(){document.getElementById('entry').style.display='none';document.getElementById('app').style.display='block';setView('home')}
function setView(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function hero(){const x=copy[view];return `<section class="hero"><div><div class="eyebrow">${x[0]}</div><h2>${x[1]}</h2><p>${x[2]}</p></div><div class="mark"><b>AI</b><small>AMAR</small></div></section>`}
function composer(){return `<div class="composer"><textarea id="prompt" placeholder="اكتب طلبك هنا…" ${agentBusy?'disabled':''}></textarea><button id="sendAgent" onclick="ask()" ${agentBusy?'disabled':''}>${agentBusy?'جارٍ المعالجة…':'إرسال <b>←</b>'}</button></div>`}
function render(){const c=document.getElementById('content');if(view==='home')c.innerHTML=hero()+`<div class="grid"><button class="card main" onclick="setView('assistant')"><div class="label">AGENT</div><h3>ابدأ محادثة جديدة</h3><p>اسأل، حلّل، خطط، وراجع النتائج من مساحة واحدة.</p><span class="arrow">←</span></button><button class="card" onclick="setView('research')"><div class="label">RESEARCH</div><h3>بحث موثّق</h3><p>انتقل إلى مسار البحث والتحقق.</p><span class="arrow">←</span></button><button class="card" onclick="setView('workspace')"><div class="label">WORKSPACE</div><h3>مساحة العمل</h3><p>نظّم الملفات والنتائج في مكان واحد.</p><span class="arrow">←</span></button></div>`;else if(view==='assistant')c.innerHTML=hero()+`<div class="panel"><div class="panel-head"><div><span class="dot"></span> AGENT ONLINE</div><small>Proposal / Verification / Execution boundaries preserved</small></div><div id="messages" class="messages">${messages.length?messages.map(m=>`<div class="msg ${m.u?'user':'ai'}">${escapeHtml(m.t)}</div>`).join(''):`<div class="empty"><b>مرحباً.</b><span>ما الذي تريد أن نعمل عليه؟</span></div>`}</div>${composer()}</div>`;else c.innerHTML=hero()+`<div class="module"><h3>${copy[view][1]}</h3><div class="line"></div><p>${copy[view][2]}</p><div class="state">MODULE READY · AWAITING AUTHORIZED CONNECTION</div></div>`}
function setAgentStatus(status){document.getElementById('status').textContent=status||'النظام جاهز'}
function ask(){const e=document.getElementById('prompt');if(agentBusy||!e||!e.value.trim())return;const t=e.value.trim();messages.push({u:true,t});agentBusy=true;setAgentStatus('Agent: يعالج الطلب…');setView('assistant');if(window.Android&&Android.ask){Android.ask(t)}else{agentBusy=false;messages.push({t:'حالة محلية: لا يوجد جسر Android في نسخة الويب.'});setAgentStatus('غير متصل');setView('assistant')}}
function receiveAgent(text,status){agentBusy=false;messages.push({t});setAgentStatus(status||'تمت الاستجابة');setView('assistant')}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function amarAiSetBackground(v){document.body.dataset.background=v}
function amarAiSetAccentColor(v){document.body.dataset.accent=v}
function amarAiRequestUpdate(){document.getElementById('status').textContent='تم طلب التحديث'}
</script></body></html>
