<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<style>
:root{--bg:#04070d;--panel:rgba(9,18,29,.78);--line:rgba(92,232,255,.16);--cyan:#5eeaff;--gold:#ffd66b;--text:#effcff;--muted:#89a5b2;--ok:#50e0a0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans Arabic',sans-serif}button,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer}.app{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 52% 8%,#17313d 0,#08131e 38%,#03060b 80%)}.app:before{content:"";position:absolute;inset:-45%;background:conic-gradient(from 10deg,transparent,#1cdfff18,transparent 28%,#ffd66b10,transparent 58%,#1cdfff0c,transparent 82%);animation:spin 30s linear infinite}.grid{position:absolute;inset:0;background-image:linear-gradient(#7deaff08 1px,transparent 1px),linear-gradient(90deg,#7deaff08 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent)}.particles{position:absolute;inset:0;opacity:.4;background:radial-gradient(circle at 12% 24%,#5eeaff 0 1px,transparent 2px),radial-gradient(circle at 72% 30%,#ffd66b 0 1px,transparent 2px),radial-gradient(circle at 58% 78%,#5eeaff 0 1px,transparent 2px);background-size:190px 170px,230px 210px,210px 190px;animation:drift 18s linear infinite}.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:2}.screen.active{display:flex}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 48px #0008,inset 0 1px #fff10;backdrop-filter:blur(20px)}.entry{align-items:center;justify-content:center;text-align:center;padding:25px}.orb{width:188px;height:188px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 30% 22%,#31505a,#0a1620 58%,#03060b);border:1px solid #ffd66b99;box-shadow:0 0 0 10px #ffd66b0a,0 0 110px #5eeaff2b,inset 0 0 45px #5eeaff12;animation:float 4.5s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;border:1px solid #5eeaff55}.orb:before{inset:-22px;animation:spin 11s linear infinite}.orb:after{inset:-42px;border-color:#ffd66b33;animation:spin 18s linear infinite reverse}.orb b{font-size:37px;color:var(--gold);letter-spacing:3px;text-shadow:0 0 25px #ffd66b66}.entry .kicker{margin-top:35px}.kicker{color:#63eaff;font-size:9px;letter-spacing:3px;font-weight:900}.entry h1{margin:8px 0;font-size:41px;letter-spacing:4px}.entry p{max-width:620px;color:var(--muted);line-height:1.9;font-size:12px}.primary{padding:15px 30px;border-radius:18px;background:linear-gradient(135deg,#ffd66b,#bf872d);color:#071017;font-weight:1000;box-shadow:0 15px 42px #ffd66b25}.safe{margin-top:14px;color:var(--ok);font-size:10px}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:4}.brand{display:flex;align-items:center;gap:10px}.mini{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--gold);font-weight:1000;border:1px solid #ffd66b44;background:#0d1923;box-shadow:0 0 28px #5eeaff14}.brand b,.brand small{display:block}.brand small{color:var(--muted);font-size:8px;margin-top:2px}.status{padding:9px 12px;border-radius:14px;font-size:10px;color:var(--ok)}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:6px;box-shadow:0 0 14px var(--ok)}.body{display:grid;grid-template-columns:200px 1fr;gap:11px;padding:10px 12px 12px;min-height:0;flex:1}.nav{padding:11px;border-radius:22px;display:flex;flex-direction:column;gap:5px}.nav-title{padding:3px 8px 9px;color:#54717f;font-size:8px;letter-spacing:3px}.nav button{background:transparent;text-align:right;padding:13px 12px;border-radius:15px;color:var(--muted);font-weight:800;transition:.2s}.nav button.active{background:#5eeaff10;color:var(--cyan);border:1px solid #5eeaff20;box-shadow:inset 3px 0 #5eeaff}.nav button:hover{color:#eaffff;background:#5eeaff08}.content{min-width:0;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:2px 2px 4px}.hero{padding:19px;border-radius:24px;display:flex;align-items:center;justify-content:space-between}.hero h2{margin:4px 0;font-size:26px}.hero p{margin:0;color:var(--muted);font-size:10px}.core{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid #ffd66b66;background:radial-gradient(circle,#24424c,#071018 64%);color:var(--gold);font-weight:1000;box-shadow:0 0 42px #5eeaff18;animation:float 5s ease-in-out infinite}.core:before,.core:after{content:"";position:absolute;border-radius:50%;border:1px solid #5eeaff33}.core:before{inset:-10px;animation:spin 9s linear infinite}.core:after{inset:-20px;border-color:#ffd66b22;animation:spin 14s linear infinite reverse}.core i,.core em{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}.core i{top:12px;right:25px}.core em{bottom:17px;left:23px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{padding:15px;border-radius:19px;min-height:112px}.card b{display:block;color:var(--cyan);font-size:9px;letter-spacing:2px;margin-bottom:7px}.card strong{display:block;font-size:13px;margin-bottom:6px}.card span{color:var(--muted);font-size:10px;line-height:1.7}.workspace{padding:13px;border-radius:21px;min-height:300px;display:flex;flex-direction:column;gap:9px}.workspace-head{display:flex;justify-content:space-between;color:var(--cyan);font-size:9px}.workspace-head small{color:#54717f;font-size:8px}.messages{flex:1;overflow:auto;padding:2px}.bubble{padding:11px 13px;border-radius:16px;background:#5eeaff09;border:1px solid #5eeaff12;color:#ccecf3;font-size:11px;line-height:1.75;margin-bottom:7px}.bubble.user{background:#ffd66b0d;border-color:#ffd66b18;color:#fff0bf}.composer{display:flex;gap:7px;align-items:flex-end;padding:8px;border-radius:18px}.composer textarea{flex:1;resize:none;min-height:46px;max-height:120px;background:transparent;border:0;outline:0;padding:9px;font-size:11px}.tool{width:42px;height:42px;border-radius:13px;background:#ffffff08;border:1px solid #ffffff10}.send{background:linear-gradient(135deg,#5eeaff,#238ba3);color:#041017;font-weight:1000}.bottom{display:flex;gap:7px;overflow:auto;padding:0 12px 10px}.bottom button{white-space:nowrap;padding:9px 12px;border-radius:13px;background:#ffffff07;border:1px solid #ffffff10;font-size:9px}.placeholder{padding:28px;border-radius:22px;min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.placeholder-core{width:125px;height:125px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffd66b44;background:radial-gradient(circle,#203d48,#071018);color:var(--gold);font-size:10px;letter-spacing:2px;animation:float 5s ease-in-out infinite}.placeholder p{max-width:420px;color:var(--muted);font-size:10px;line-height:1.8}.hidden{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes drift{50%{transform:translate3d(9px,-8px,0)}}@media(max-width:720px){.body{grid-template-columns:1fr}.nav{display:flex;flex-direction:row;overflow:auto;padding:7px}.nav-title{display:none}.nav button{white-space:nowrap}.cards{grid-template-columns:1fr}.hero{min-height:135px}.core{width:74px;height:74px}.top{height:58px}.entry h1{font-size:34px}.orb{width:160px;height:160px}}
</style>
</head>
<body><div class="app"><div class="grid"></div><div class="particles"></div>
<section id="entry" class="screen active entry"><div class="orb"><b>AMAR</b></div><div class="kicker">CENTRAL INTELLIGENCE WORKSPACE</div><h1>AMAR AI</h1><p>واجهة ثلاثية الأبعاد حية ومتكاملة؛ التفاعل يمر إلى الوكيل المركزي، والنتائج تعرض وفق الأدلة والصلاحيات الفعلية.</p><button class="primary" onclick="enterApp()">دخول إلى AMAR AI ↗</button><div class="safe">● FAIL-CLOSED · AGENT-CENTRIC · EVIDENCE FIRST</div></section>
<section id="workspaceScreen" class="screen"><header class="top"><div class="brand"><div class="mini">A</div><div><b>AMAR AI</b><small>Central Agent Workspace</small></div></div><div class="glass status"><i></i><span id="status">جاهز</span></div></header><div class="body"><aside class="glass nav"><div class="nav-title">SYSTEM</div><button class="active" data-view="home">المحور</button><button data-view="assistant">AMAR Agent</button><button data-view="research">البحث</button><button data-view="workspace">مساحة العمل</button><button data-view="files">الملفات</button><button data-view="memory">الذاكرة</button><button data-view="settings">الإعدادات</button></aside><main class="content" id="content"></main></div><div class="bottom"><button onclick="pickFile()">📎 ملف</button><button onclick="pickImage()">▧ صورة</button><button class="disabled">🎙 صوت</button><button class="disabled">▣ كاميرا</button><button class="disabled">▥ شاشة</button><button onclick="setView('settings')">⚙ الإعدادات</button></div><input id="file" class="hidden" type="file" onchange="fileSelected(this)"><input id="image" class="hidden" type="file" accept="image/*" onchange="fileSelected(this)"></section>
</div>
<script>
const views={home:'المحور',assistant:'AMAR Agent',research:'البحث',workspace:'مساحة العمل',files:'الملفات',memory:'الذاكرة',settings:'الإعدادات'};let current='home',messages=[];
function enterApp(){entry.classList.remove('active');workspaceScreen.classList.add('active');setView('home')}
function setView(v){current=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function shell(title,kicker,body,core='AMAR'){return `<section class="glass hero"><div><div class="kicker">${kicker}</div><h2>${title}</h2><p>واجهة واحدة مرتبطة بسلطة AMAR AI Agent والمحركات المتاحة.</p></div><div class="core">${core}<i></i><em></em></div></section>${body}`}
function render(){const c=document.getElementById('content');if(current==='home'){c.innerHTML=shell('مركز الذكاء','AMAR AI / HOME',`<div class="cards"><div class="glass card"><b>AGENT</b><strong>العقل المركزي</strong><span>توجيه الطلبات إلى الوكيل دون إنشاء سلطة موازية.</span></div><div class="glass card"><b>EVIDENCE</b><strong>دليل قابل للتتبع</strong><span>عرض ما تم إثباته فقط، مع إبقاء المجهول مجهولاً.</span></div><div class="glass card"><b>CONTROL</b><strong>حدود آمنة</strong><span>التنفيذ منفصل عن العرض ومحكوم بالصلاحيات والتأكيد.</span></div></div><div class="glass workspace"><div class="workspace-head"><span>AMAR AGENT</span><small>CONNECTED UI CHANNEL</small></div><div class="messages"><div class="bubble">مرحباً. أنا AMAR AI. اكتب طلبك لبدء المسار المركزي.</div></div>${composer()}</div>`)}else if(current==='assistant'){c.innerHTML=shell('AMAR Agent','AMAR AI / AGENT',`<div class="glass workspace"><div class="workspace-head"><span>AGENT CONSOLE</span><small id="agentState">READY</small></div><div id="messages" class="messages">${messages.map(m=>`<div class="bubble ${m.u?'user':''}">${escapeHtml(m.t)}</div>`).join('')}</div>${composer()}</div>`,'AI')}else if(current==='research'){c.innerHTML=shell('البحث والتحقق','AMAR AI / RESEARCH','<div class="glass placeholder"><div class="placeholder-core">RESEARCH</div><p>البحث الموثق والقراءة والتحقق تمر عبر محركات البحث والأدلة المعتمدة؛ لا تُعرض نتيجة غير مثبتة كحقيقة.</p></div>')}else if(current==='workspace'){c.innerHTML=shell('مساحة العمل','AMAR AI / WORKSPACE','<div class="glass placeholder"><div class="placeholder-core">WORKSPACE</div><p>مساحة موحدة للمواد والمخرجات والمراجع، مع فصل التخزين عن التنفيذ.</p></div>')}else if(current==='files'){c.innerHTML=shell('الملفات','AMAR AI / FILES','<div class="glass placeholder"><div class="placeholder-core">FILES</div><p>الملف بيانات واردة فقط. التحليل أو التنفيذ لا يحدث تلقائياً.</p></div>')}else if(current==='memory'){c.innerHTML=shell('الذاكرة','AMAR AI / MEMORY','<div class="glass placeholder"><div class="placeholder-core">MEMORY</div><p>تظهر الذاكرة المؤكدة والقابلة للتتبع فقط.</p></div>')}else{c.innerHTML=shell('الإعدادات','AMAR AI / SETTINGS','<div class="glass placeholder"><div class="placeholder-core">SETTINGS</div><p>إعدادات العرض والمؤثرات والواجهة، دون تغيير سلطة المحرك.</p></div>')}}
function composer(){return `<div class="composer glass"><button class="tool" onclick="pickFile()">＋</button><textarea id="prompt" placeholder="اكتب طلبك للوكيل…"></textarea><button class="tool send" onclick="ask()">➤</button></div>`}
function ask(){const e=document.getElementById('prompt');if(!e||!e.value.trim())return;const t=e.value.trim();messages.push({u:true,t});document.getElementById('status').textContent='جارٍ تمرير الطلب';if(window.Android&&Android.ask){Android.ask(t)}else{messages.push({t:'الجسر الأصلي غير متصل في هذه البيئة.'});document.getElementById('status').textContent='غير متصل';render()}}
function receiveAgent(text,status){messages.push({t:text});document.getElementById('status').textContent=status||'تمت الاستجابة';setView('assistant')}
function pickFile(){document.getElementById('file').click()}function pickImage(){document.getElementById('image').click()}function fileSelected(el){if(el.files&&el.files[0]){messages.push({t:'تم استلام: '+el.files[0].name});setView('assistant')}}function escapeHtml(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}render();
</script></body></html>
