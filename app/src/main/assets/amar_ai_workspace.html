<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<style>
:root{--bg:#05070d;--panel:rgba(13,20,31,.78);--panel2:rgba(20,30,43,.86);--line:rgba(128,231,255,.16);--cyan:#5eeaff;--gold:#ffd66b;--text:#effcff;--muted:#8ba7b5;--ok:#50e0a0;--danger:#ff6c7d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans Arabic',sans-serif}button,textarea{font:inherit;color:inherit}button{border:0}.app{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 18%,#172a36 0,#09121d 35%,#05070d 75%)}.app:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 20deg,transparent,#1cdfff18,transparent 32%,#ffd66b0d,transparent 60%);animation:spin 28s linear infinite}.grid{position:absolute;inset:0;background-image:linear-gradient(#7deaff08 1px,transparent 1px),linear-gradient(90deg,#7deaff08 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent)}.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:2}.screen.active{display:flex}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 42px #0008, inset 0 1px #fff10;backdrop-filter:blur(18px)}.entry{align-items:center;justify-content:center;text-align:center;padding:24px}.orb{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 35% 25%,#29424d,#0c1721 54%,#05070d);border:1px solid #ffd66b88;box-shadow:0 0 0 8px #ffd66b0c,0 0 80px #5eeaff25;animation:float 4s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;inset:-18px;border:1px solid #5eeaff55;border-radius:50%;animation:spin 12s linear infinite}.orb:after{inset:-34px;border-color:#ffd66b33;animation-direction:reverse;animation-duration:19s}.orb b{font-size:35px;color:var(--gold);text-shadow:0 0 22px #ffd66b}.entry h1{margin:28px 0 4px;font-size:34px}.entry p{max-width:520px;color:var(--muted);line-height:1.8;margin:0 auto 25px}.primary{padding:14px 28px;border-radius:18px;background:linear-gradient(135deg,#ffd66b,#c28a2e);color:#071018;font-weight:1000;box-shadow:0 10px 32px #ffd66b25}.safe{margin-top:14px;color:var(--ok);font-size:11px}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:4}.brand{display:flex;align-items:center;gap:10px}.mini{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--gold);font-weight:1000;border:1px solid #ffd66b44;background:#0e1822}.brand small{display:block;color:var(--muted);font-size:9px}.status{padding:8px 10px;border-radius:14px;font-size:10px}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:5px;box-shadow:0 0 12px var(--ok)}.body{display:grid;grid-template-columns:190px 1fr;gap:10px;padding:10px 12px 12px;min-height:0;flex:1}.nav{padding:10px;display:flex;flex-direction:column;gap:6px;border-radius:20px}.nav button{background:transparent;text-align:right;padding:12px;border-radius:14px;color:var(--muted);font-weight:800}.nav button.active,.nav button:active{background:#5eeaff12;color:var(--cyan);border:1px solid #5eeaff22}.content{min-width:0;display:flex;flex-direction:column;gap:10px;overflow:auto;padding-bottom:4px}.hero{padding:18px;border-radius:22px;display:flex;align-items:center;justify-content:space-between}.hero h2{margin:3px 0;font-size:24px}.hero p{margin:0;color:var(--muted);font-size:11px}.core{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffd66b66;background:radial-gradient(circle,#213d48,#091019);color:var(--gold);font-weight:1000;box-shadow:0 0 35px #5eeaff18}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{padding:15px;border-radius:18px;min-height:100px}.card b{display:block;color:var(--cyan);margin-bottom:8px}.card span{color:var(--muted);font-size:10px;line-height:1.6}.workspace{padding:14px;border-radius:20px;min-height:170px;display:flex;flex-direction:column;gap:9px}.messages{flex:1;overflow:auto}.bubble{padding:11px 13px;border-radius:16px;background:#5eeaff0a;border:1px solid #5eeaff12;color:#ccecf3;font-size:12px;line-height:1.7;margin-bottom:7px}.bubble.user{background:#ffd66b0c;border-color:#ffd66b18;color:#fff1c4}.composer{display:flex;gap:7px;align-items:flex-end;padding:9px;border-radius:18px;position:sticky;bottom:0}.composer textarea{flex:1;resize:none;min-height:46px;max-height:120px;background:transparent;border:0;outline:0;padding:10px;font-size:12px}.tool{width:42px;height:42px;border-radius:13px;background:#ffffff08;border:1px solid #ffffff10}.send{background:linear-gradient(135deg,#5eeaff,#238ba3);color:#041017}.disabled{opacity:.42}.banner{padding:11px;border-radius:16px;font-size:10px;color:var(--muted)}.bottom{display:flex;gap:7px;overflow:auto;padding:0 12px 10px}.bottom button{white-space:nowrap;padding:9px 12px;border-radius:13px;background:#ffffff07;border:1px solid #ffffff10;font-size:10px}.rtlnote{direction:rtl}.hidden{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-6px)}}@media(max-width:720px){.body{grid-template-columns:1fr}.nav{display:none}.cards{grid-template-columns:1fr}.hero{min-height:120px}.core{width:70px;height:70px}.top{height:58px}}
</style>
</head>
<body>
<div class="app"><div class="grid"></div>
<section id="entry" class="screen active entry">
 <div class="orb"><b>AMAR</b></div><h1>AMAR AI</h1><p>مساحة الذكاء الموحدة — واجهة العرض والتفاعل فقط. القرار، الأدلة، الذاكرة والحوكمة تبقى تحت سلطة المحرك.</p>
 <button class="primary" onclick="enterApp()">دخول إلى مساحة AMAR AI</button><div class="safe">● Fail-Closed · لا Gemini · لا تنفيذ تداول من الواجهة</div>
</section>
<section id="workspaceScreen" class="screen">
 <header class="top"><div class="brand"><div class="mini">A</div><div><b>AMAR AI</b><small>Agent Workspace · UI Layer</small></div></div><div class="glass status"><i></i><span id="status">جاهز</span></div></header>
 <div class="body">
  <aside class="glass nav"><button class="active" data-view="home">المحور</button><button data-view="assistant">AI Assistant</button><button data-view="research">Research</button><button data-view="workspace">Workspace</button><button data-view="files">Files</button><button data-view="memory">Memory</button><button data-view="settings">Settings</button></aside>
  <main class="content" id="content"></main>
 </div>
 <div class="bottom"><button onclick="pickFile()">📎 ملف</button><button onclick="pickImage()">▧ صورة</button><button class="disabled" title="Stage 10">🎙 صوت · Stage 10</button><button class="disabled" title="Stage 10">▣ كاميرا · Stage 10</button><button class="disabled" title="Stage 10">▥ شاشة · Stage 10</button><button onclick="setView('settings')">⚙ الإعدادات</button></div>
 <input id="file" class="hidden" type="file" onchange="fileSelected(this)"><input id="image" class="hidden" type="file" accept="image/*" onchange="fileSelected(this)">
</section>
</div>
<script>
const views={home:'المحور',assistant:'AI Assistant',research:'Research',workspace:'Workspace',files:'Files',memory:'Memory',settings:'Settings'};let current='home',messages=[];
function enterApp(){document.getElementById('entry').classList.remove('active');document.getElementById('workspaceScreen').classList.add('active');setView('home')}
function setView(v){current=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function render(){const c=document.getElementById('content');if(current==='home')c.innerHTML=`<section class="glass hero"><div><small>AMAR AI / HOME</small><h2>مساحة الذكاء الآمنة</h2><p>واجهة رئيسية + مساحة Agent متصلة بحدود المحرك.</p></div><div class="core">AMAR</div></section><div class="cards"><div class="glass card"><b>Agent</b><span>المحرك المركزي هو صاحب القرار. الواجهة لا تنشئ سلطة موازية.</span></div><div class="glass card"><b>Evidence</b><span>النتيجة غير المؤكدة لا تتحول إلى نجاح؛ الواجهة تعرض حالة التحقق كما تصلها.</span></div><div class="glass card"><b>Security</b><span>Fail-Closed. الكاميرا والشاشة والصوت مؤجلة للربط المعتمد في Stage 10.</span></div></div><div class="glass workspace"><div class="messages"><div class="bubble">مرحباً. أنا AMAR AI. اكتب طلبك لتمريره إلى حدود المحرك المتاحة حالياً.</div></div>${composer()}</div>`;else if(current==='assistant')c.innerHTML=`<section class="glass hero"><div><small>AMAR AI / AGENT</small><h2>AI Assistant</h2><p>لا Gemini ولا مزود خارجي مطلوب لمسار الواجهة.</p></div><div class="core">AI</div></section><div class="glass workspace"><div id="messages" class="messages">${messages.map(m=>`<div class="bubble ${m.u?'user':''}">${escapeHtml(m.t)}</div>`).join('')}</div>${composer()}</div>`;else if(current==='research')c.innerHTML=`<section class="glass hero"><div><small>AMAR AI / RESEARCH</small><h2>البحث والتحقق</h2><p>عرض حدود البحث الحالية؛ التحقق الحقيقي يبقى من المحرك.</p></div></section><div class="glass banner">الحالة: <b>مقيدة</b> · لا يتم الادعاء بوجود بحث موثق قبل وصول أدلة من المحرك.</div>`;else if(current==='workspace')c.innerHTML=`<section class="glass hero"><div><small>AMAR AI / WORKSPACE</small><h2>مساحة العمل</h2><p>المواد والمخرجات تحفظ وتدار وفق صلاحيات المحرك.</p></div></section><div class="glass banner">المساحة جاهزة للربط التدريجي مع File/Memory/Research contracts.</div>`;else if(current==='files')c.innerHTML=`<section class="glass hero"><div><small>AMAR AI / FILES</small><h2>الملفات</h2><p>رفع الملفات من الواجهة لا يعني تنفيذها.</p></div><div class="glass banner">اختر ملفاً من شريط الأدوات لعرض حالة الاستلام. التحليل الفعلي يحتاج عقد المحرك المناسب.</div>`;else if(current==='memory')c.innerHTML=`<section class="glass hero"><div><small>AMAR AI / MEMORY</small><h2>الذاكرة</h2><p>الذاكرة سلطة مستقلة خارج طبقة العرض.</p></div><div class="glass banner">لا تُعرض ذاكرة مزعومة؛ لا تظهر إلا بيانات مؤكدة من المحرك.</div>`;else c.innerHTML=`<section class="glass hero"><div><small>AMAR AI / SETTINGS</small><h2>الإعدادات</h2><p>تحكم بصري فقط.</p></div><div class="glass banner">الوضع: واجهة ديناميكية · Fail-Closed · Gemini: غير موجود في المسار.</div>`}
function composer(){return `<div class="composer glass"><button class="tool" onclick="pickFile()">＋</button><textarea id="prompt" placeholder="اكتب طلبك…"></textarea><button class="tool send" onclick="ask()">➤</button></div>`}
function ask(){const e=document.getElementById('prompt');if(!e||!e.value.trim())return;const t=e.value.trim();messages.push({u:true,t});document.getElementById('status').textContent='جارٍ تمرير الطلب';if(window.Android&&Android.ask){Android.ask(t)}else{messages.push({t:'حالة محلية: لا يوجد جسر Android في نسخة الويب.'});document.getElementById('status').textContent='غير متصل';render()}}
function receiveAgent(text,status){messages.push({t});document.getElementById('status').textContent=status||'تمت الاستجابة';setView('assistant')}
function pickFile(){document.getElementById('file').click()}function pickImage(){document.getElementById('image').click()}function fileSelected(el){if(el.files&&el.files[0]){messages.push({t:'تم استلام: '+el.files[0].name+' — بانتظار عقد التحليل المصرح.'});setView('assistant')}}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
</script>
</body></html>
