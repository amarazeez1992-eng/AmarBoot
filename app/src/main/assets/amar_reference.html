<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,'Noto Sans Arabic',sans-serif;color:#173f46}body{-webkit-tap-highlight-color:transparent}.scene{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 42%,#fff 0,#f8ffff 48%,#eef8f7 100%)}
.top{position:absolute;top:2.5%;left:4%;right:4%;height:9%;display:flex;align-items:center;justify-content:space-between;z-index:5}.brand{font-size:clamp(19px,5vw,30px);font-weight:950;letter-spacing:.5px}.sub{font-size:10px;color:#679096;font-weight:800;margin-top:2px}.clock{direction:ltr;font-weight:900;font-size:18px;background:#fff;border:1px solid #dcebea;border-radius:16px;padding:8px 12px;box-shadow:0 8px 24px #a7c5c222}.live{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:900;padding:8px 12px;border-radius:16px;background:#fff;border:1px solid #dcebea;box-shadow:0 8px 24px #a7c5c222}.dot{width:8px;height:8px;border-radius:50%;background:#16c98a;box-shadow:0 0 12px #16c98a;animation:p 1.6s infinite}
.coreWrap{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:min(62vw,270px);aspect-ratio:1;z-index:4}.core{position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0,#f8ffff 38%,#e3f2f0 100%);border:2px solid #d2e7e4;box-shadow:inset 0 0 28px #7fc5bb22,0 22px 55px #528b8428,0 0 0 12px #ffffffaa,0 0 0 14px #dcecea88;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:perspective(600px) rotateX(5deg);animation:float 4s ease-in-out infinite}.coreTitle{font-size:clamp(23px,6vw,34px);font-weight:1000}.coreValue{font-size:12px;color:#4e777c;font-weight:800;margin-top:4px}.coreState{margin-top:12px;padding:7px 14px;border-radius:18px;background:#e8fbf4;color:#078661;font-size:10px;font-weight:950;box-shadow:0 5px 18px #16c98a20}.orbit{position:absolute;inset:0;border:1px solid #72cfc133;border-radius:50%;animation:spin 14s linear infinite}.orbit:before,.orbit:after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#19c98a;box-shadow:0 0 15px #19c98a}.orbit:before{top:7%;left:50%}.orbit:after{bottom:8%;right:15%}
.nodes{position:absolute;inset:17% 4% 18%;z-index:6;pointer-events:none}.node{position:absolute;pointer-events:auto;width:86px;height:86px;border-radius:50%;background:linear-gradient(145deg,#fff,#edf7f6);border:1px solid #d2e5e3;box-shadow:10px 12px 28px #4b898022,-5px -5px 16px #fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:950;color:#24545a;transition:.18s}.node:active{transform:scale(.94)}.n1{left:2%;top:8%}.n2{right:2%;top:8%}.n3{left:1%;bottom:7%}.n4{right:1%;bottom:7%}.n5{left:50%;top:3%;transform:translateX(-50%)}.n6{left:50%;bottom:1%;transform:translateX(-50%)}
.panel{position:absolute;bottom:3%;left:4%;right:4%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;z-index:8}.action{min-height:54px;border-radius:17px;background:#fff;border:1px solid #dcebea;box-shadow:0 8px 22px #477f7920;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:950;color:#28565c}.action b{font-size:17px;margin-bottom:2px}.action.primary{background:linear-gradient(145deg,#effff9,#dff9ef);border-color:#aee5d1;color:#087b61}.action.danger{background:linear-gradient(145deg,#fff7f7,#fff);border-color:#f1c9cb;color:#bd4650}.toast{position:absolute;left:50%;top:62%;transform:translate(-50%,12px);opacity:0;padding:10px 17px;border-radius:18px;background:#fff;box-shadow:0 12px 30px #325e5b22;font-size:11px;font-weight:950;z-index:30;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes p{50%{box-shadow:0 0 0 7px #16c98a00,0 0 18px #16c98a}}@keyframes float{50%{transform:perspective(600px) rotateX(-3deg) translateY(-5px)}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body><div class="scene" id="scene">
<div class="top"><div><div class="brand">عمار</div><div class="sub">مركز التداول الذكي</div></div><div class="live"><i class="dot"></i> النظام جاهز</div><div class="clock" id="clock">00:00</div></div>
<div class="coreWrap"><div class="orbit"></div><div class="core"><div class="coreTitle">عمار</div><div class="coreValue">مركز القيادة</div><div class="coreState">● متصل</div></div></div>
<div class="nodes">
<button class="node n1" onclick="openRoom('MARKET');show('السوق')">السوق<br>الحي</button>
<button class="node n2" onclick="openRoom('BOT_LAB');show('مختبر البوتات')">مختبر<br>البوتات</button>
<button class="node n3" onclick="openRoom('CHART');show('الرسم البياني')">الرسم<br>البياني</button>
<button class="node n4" onclick="openRoom('ANALYSIS');show('التحليل')">التحليل<br>الذكي</button>
<button class="node n5" onclick="openRoom('ACCOUNTS');show('حسابات التداول')">الحسابات</button>
<button class="node n6" onclick="openRoom('SETTINGS');show('الإعدادات')">الإعدادات</button>
</div>
<div class="panel"><button class="action primary" onclick="openRoom('COMMAND_CENTER')"><b>⌂</b>مركز القيادة</button><button class="action" onclick="openRoom('POSITIONS')"><b>◉</b>الصفقات</button><button class="action" onclick="openRoom('PERFORMANCE')"><b>↗</b>الأداء</button><button class="action danger" onclick="openRoom('RISK')"><b>!</b>المخاطر</button></div>
<div class="toast" id="toast">جاهز</div></div>
<script>let t;function show(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(t);t=setTimeout(()=>e.classList.remove('show'),1100)}function openRoom(x){if(window.Android&&Android.openRoom)Android.openRoom(x)}function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}updateClock();setInterval(updateClock,1000)</script></body></html>
