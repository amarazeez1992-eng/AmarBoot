<!doctype html><html lang="ar" dir="rtl"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#f7d77a;font-family:system-ui,'Noto Sans Arabic',sans-serif}button{font:inherit;color:inherit}.scene{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 43%,#17232b 0,#091017 34%,#05070b 72%,#020306 100%)}.scene:before,.scene:after{content:'';position:absolute;border-radius:50%;pointer-events:none}.scene:before{width:90vw;height:90vw;left:5vw;top:16vh;border:1px solid #00d9ff33;box-shadow:0 0 70px #00d9ff12,inset 0 0 80px #d8a83a0b}.scene:after{width:70vw;height:70vw;left:15vw;top:25vh;border:1px solid #d8a83a35;box-shadow:0 0 55px #d8a83a12}.top{position:absolute;top:2.5%;left:4%;right:4%;height:9%;display:flex;align-items:center;justify-content:space-between;z-index:10}.brand{font-size:clamp(24px,6vw,36px);font-weight:1000;letter-spacing:1px;background:linear-gradient(90deg,#fff3b0,#d8a83a,#00d9ff);-webkit-background-clip:text;color:transparent}.sub{font-size:9px;color:#86a8b2;font-weight:800}.pill{border:1px solid #d8a83a55;background:#0b1118cc;border-radius:18px;padding:8px 11px;font-size:9px;font-weight:900;box-shadow:0 0 18px #d8a83a12}.live{display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#00e6a0;box-shadow:0 0 16px #00e6a0;animation:pulse 1.3s infinite}.clock{direction:ltr;color:#c9f8ff}.coreWrap{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(64vw,285px);aspect-ratio:1;z-index:5}.orbit{position:absolute;inset:0;border:1px solid #00d9ff66;border-radius:50%;box-shadow:0 0 24px #00d9ff18;animation:spin 18s linear infinite}.orbit:before,.orbit:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#00d9ff;box-shadow:0 0 22px #00d9ff}.orbit:before{top:6%;left:50%}.orbit:after{bottom:15%;right:9%;background:#d8a83a;box-shadow:0 0 22px #d8a83a}.core{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle at 38% 27%,#263943 0,#101b23 42%,#060a0f 78%);border:2px solid #d8a83a;box-shadow:0 0 0 5px #d8a83a12,0 0 0 12px #00d9ff10,0 0 55px #00d9ff2c,inset 0 0 35px #00d9ff12;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:float 4s ease-in-out infinite;overflow:hidden}.core:before{content:'';position:absolute;width:70%;height:70%;border:1px dashed #d8a83a66;border-radius:50%;animation:spin 11s linear infinite reverse}.core:after{content:'';position:absolute;inset:12%;border-radius:50%;border:1px solid #00d9ff33}.coreTitle{position:relative;font-size:35px;font-weight:1000;color:#fff2ad;text-shadow:0 0 18px #d8a83a99}.coreValue{position:relative;font-size:11px;color:#8defff;font-weight:900;margin-top:4px}.coreState{position:relative;margin-top:13px;padding:7px 16px;border:1px solid #00d9ff66;border-radius:20px;background:#07151c;color:#00e6d4;font-size:9px;font-weight:950;box-shadow:0 0 18px #00d9ff22}.nodes{position:absolute;inset:15% 3% 20%;z-index:8}.node{position:absolute;width:82px;height:82px;border-radius:50%;background:linear-gradient(145deg,#17242b,#070b10);border:1px solid #00d9ff66;box-shadow:0 0 18px #00d9ff1a,inset 0 0 20px #d8a83a0b;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;font-weight:950;color:#bff7ff;transition:.2s;animation:nodeFloat 3.5s ease-in-out infinite}.node:active{transform:scale(.9);border-color:#fff0a0;box-shadow:0 0 30px #d8a83a77}.n1{left:1%;top:10%;animation-delay:.2s}.n2{right:1%;top:10%;animation-delay:.8s}.n3{left:0;bottom:8%;animation-delay:1.3s}.n4{right:0;bottom:8%;animation-delay:1.9s}.n5{left:50%;top:1%;transform:translateX(-50%);animation-delay:2.3s}.n6{left:50%;bottom:0;transform:translateX(-50%);animation-delay:2.8s}.panel{position:absolute;bottom:3%;left:4%;right:4%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;z-index:12}.action{min-height:55px;border-radius:17px;background:linear-gradient(145deg,#111c23,#070b10);border:1px solid #00d9ff44;box-shadow:0 8px 25px #0008,0 0 15px #00d9ff0d;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:950;color:#a9eaf4}.action b{font-size:17px;margin-bottom:2px;color:#d8a83a;text-shadow:0 0 10px #d8a83a}.action.primary{border-color:#d8a83a88;background:linear-gradient(145deg,#19160e,#0b0d10);color:#ffe69a}.action.danger{border-color:#ff426655;color:#ff7b85}.toast{position:absolute;left:50%;top:64%;transform:translate(-50%,12px);opacity:0;padding:9px 16px;border-radius:18px;background:#09151c;border:1px solid #00d9ff55;box-shadow:0 0 25px #00d9ff22;font-size:10px;font-weight:950;z-index:30;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{box-shadow:0 0 0 7px #00e6a000,0 0 20px #00e6a0}}@keyframes float{50%{transform:perspective(600px) rotateX(-4deg) translateY(-6px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes nodeFloat{50%{translate:0 -4px}}</style></head><body><div class="scene"><div class="top"><div><div class="brand">عمار</div><div class="sub">مركز القيادة الذكي</div></div><div class="pill live"><i class="dot"></i>النظام جاهز</div><div class="pill clock" id="clock">00:00</div></div><div class="coreWrap"><div class="orbit"></div><div class="core"><div class="coreTitle">عمار</div><div class="coreValue">مركز القيادة</div><div class="coreState">● متصل ونشط</div></div></div><div class="nodes"><button class="node n1" onclick="openRoom('MARKET');show('السوق الحي')">السوق<br>الحي</button><button class="node n2" onclick="openRoom('BOT_LAB');show('مختبر البوتات')">مختبر<br>البوتات</button><button class="node n3" onclick="openRoom('CHART');show('الرسم البياني')">الرسم<br>البياني</button><button class="node n4" onclick="openRoom('ANALYSIS');show('التحليل الذكي')">التحليل<br>الذكي</button><button class="node n5" onclick="openRoom('ACCOUNTS');show('حسابات التداول')">الحسابات</button><button class="node n6" onclick="openRoom('SETTINGS');show('الإعدادات')">الإعدادات</button></div><div class="panel"><button class="action primary" onclick="openRoom('COMMAND_CENTER')"><b>⌂</b>مركز القيادة</button><button class="action" onclick="openRoom('POSITIONS')"><b>◉</b>الصفقات</button><button class="action" onclick="openRoom('PERFORMANCE')"><b>↗</b>الأداء</button><button class="action danger" onclick="openRoom('RISK')"><b>!</b>المخاطر</button></div><div class="toast" id="toast">جاهز</div></div><script>let t;function show(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(t);t=setTimeout(()=>e.classList.remove('show'),1100)}function openRoom(x){if(window.Android&&Android.openRoom)Android.openRoom(x)}function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}updateClock();setInterval(updateClock,1000)</script></body></html>
