<!doctype html><html lang="ar" dir="rtl"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{--bg:#05070b;--bg2:#091017;--panel:#0b1118;--panel2:#111c23;--text:#e9fbff;--muted:#86a8b2;--cyan:#00d9ff;--gold:#d8a83a;--green:#00e6a0;--red:#ff5364}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans Arabic',sans-serif}button{font:inherit;color:inherit}.scene{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 43%,#17232b 0,var(--bg2) 34%,var(--bg) 72%,#020306 100%)}.scene:before,.scene:after{content:'';position:absolute;border-radius:50%;pointer-events:none}.scene:before{width:90vw;height:90vw;left:5vw;top:16vh;border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);box-shadow:0 0 70px color-mix(in srgb,var(--cyan) 8%,transparent)}.scene:after{width:70vw;height:70vw;left:15vw;top:25vh;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}.top{position:absolute;top:2.5%;left:4%;right:4%;height:9%;display:flex;align-items:center;justify-content:space-between;z-index:10}.brand{font-size:clamp(24px,6vw,36px);font-weight:1000;background:linear-gradient(90deg,#fff3b0,var(--gold),var(--cyan));-webkit-background-clip:text;color:transparent}.sub{font-size:9px;color:var(--muted);font-weight:800}.pill{border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--panel) 90%,transparent);border-radius:18px;padding:8px 11px;font-size:9px;font-weight:900}.live{display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green);animation:pulse 1.3s infinite}.clock{direction:ltr;color:var(--cyan)}.coreWrap{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(64vw,285px);aspect-ratio:1;z-index:5}.orbit{position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--cyan) 55%,transparent);border-radius:50%;box-shadow:0 0 24px color-mix(in srgb,var(--cyan) 12%,transparent);animation:spin 18s linear infinite}.orbit:before,.orbit:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 22px var(--cyan)}.orbit:before{top:6%;left:50%}.orbit:after{bottom:15%;right:9%;background:var(--gold);box-shadow:0 0 22px var(--gold)}.core{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle at 38% 27%,#263943 0,#101b23 42%,var(--bg) 78%);border:2px solid var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 8%,transparent),0 0 55px color-mix(in srgb,var(--cyan) 18%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:float 4s ease-in-out infinite;overflow:hidden}.core:before{content:'';position:absolute;width:70%;height:70%;border:1px dashed color-mix(in srgb,var(--gold) 60%,transparent);border-radius:50%;animation:spin 11s linear infinite reverse}.coreTitle{position:relative;font-size:35px;font-weight:1000;color:#fff2ad;text-shadow:0 0 18px var(--gold)}.coreValue{position:relative;font-size:11px;color:#8defff;font-weight:900;margin-top:4px}.coreState{position:relative;margin-top:13px;padding:7px 16px;border:1px solid color-mix(in srgb,var(--cyan) 55%,transparent);border-radius:20px;background:var(--panel);color:#00e6d4;font-size:9px;font-weight:950}.nodes{position:absolute;inset:13% 2% 19%;z-index:8}.node{position:absolute;width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,#17242b,var(--bg));border:1px solid color-mix(in srgb,var(--cyan) 50%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--cyan) 10%,transparent);display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:950;color:#bff7ff;transition:.2s;animation:nodeFloat 3.5s ease-in-out infinite;padding:3px}.node:active{transform:scale(.9);border-color:#fff0a0}.left1{left:1%;top:3%}.left2{left:1%;top:33%}.left3{left:1%;top:63%}.left4{left:1%;bottom:1%}.right1{right:1%;top:3%;animation-delay:.4s}.right2{right:1%;top:33%;animation-delay:1.1s}.right3{right:1%;top:63%;animation-delay:1.8s}.right4{right:1%;bottom:1%;animation-delay:2.4s}.future{border-style:dashed;border-color:color-mix(in srgb,var(--gold) 55%,transparent);color:color-mix(in srgb,var(--gold) 90%,#fff);font-size:22px;font-weight:400;box-shadow:0 0 18px color-mix(in srgb,var(--gold) 9%,transparent)}.panel{position:absolute;bottom:2%;left:4%;right:4%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:12}.action{min-height:48px;border-radius:15px;background:linear-gradient(145deg,var(--panel2),var(--bg));border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;font-weight:950;color:#a9eaf4}.action b{font-size:15px;margin-bottom:1px;color:var(--gold)}.action.primary{border-color:color-mix(in srgb,var(--gold) 65%,transparent);color:#ffe69a}.action.danger{border-color:color-mix(in srgb,var(--red) 40%,transparent);color:#ff7b85}.toast{position:absolute;left:50%;top:64%;transform:translate(-50%,12px);opacity:0;padding:9px 16px;border-radius:18px;background:var(--panel);border:1px solid color-mix(in srgb,var(--cyan) 35%,transparent);font-size:10px;font-weight:950;z-index:30;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{box-shadow:0 0 0 7px transparent,0 0 20px var(--green)}}@keyframes float{50%{transform:perspective(600px) rotateX(-4deg) translateY(-6px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes nodeFloat{50%{translate:0 -4px}}body.light{--bg:#f4f8fa;--bg2:#e9f4f7;--panel:#ffffff;--panel2:#e6f4f7;--text:#10232b;--muted:#5e7780;--cyan:#009fc0;--gold:#b87900}body.light .scene{background:radial-gradient(circle at 50% 43%,#fff 0,var(--bg2) 45%,var(--bg) 100%)}body.light .core{background:radial-gradient(circle at 38% 27%,#e8f8fb 0,#cfe9ee 45%,#fff 78%)}body.light .node{background:linear-gradient(145deg,#fff,#e5f3f6);color:#12313b}.light .action{color:#12313b}.aiLauncher{position:absolute;right:4%;bottom:11%;z-index:20;border:1px solid color-mix(in srgb,var(--cyan) 55%,transparent);background:linear-gradient(145deg,var(--panel2),var(--panel));border-radius:18px;padding:9px 13px;font-size:10px;font-weight:950;color:#bff7ff;box-shadow:0 0 24px color-mix(in srgb,var(--cyan) 12%,transparent)}.aiChat{position:absolute;inset:8% 4% 10%;z-index:40;display:none;flex-direction:column;border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);border-radius:24px;background:color-mix(in srgb,var(--panel) 96%,transparent);box-shadow:0 20px 70px rgba(0,0,0,.45);overflow:hidden;backdrop-filter:blur(16px)}.aiChat.open{display:flex}.aiHead{position:relative;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid color-mix(in srgb,var(--cyan) 20%,transparent)}.aiHead b{font-size:16px}.aiStatus{font-size:9px;color:var(--green);font-weight:900}.aiClose{border:0;background:transparent;font-size:22px}.chatTools{display:flex;align-items:center;gap:6px}.chatTools button{border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);border-radius:10px;background:var(--panel2);padding:6px 9px;font-size:9px;font-weight:900}.chatList{position:absolute;top:58px;right:10px;width:min(250px,82vw);max-height:58vh;overflow:auto;display:none;z-index:60;padding:10px;border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);border-radius:16px;background:color-mix(in srgb,var(--panel) 98%,transparent);box-shadow:0 16px 50px rgba(0,0,0,.45)}.chatList.open{display:block}.chatNew{width:100%;padding:10px;border-radius:11px;background:var(--panel2);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);font-size:10px;font-weight:950;margin-bottom:8px}.chatItem{width:100%;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:9px;border-radius:11px;background:transparent;border:1px solid transparent;text-align:right;font-size:10px}.chatItem.active{background:color-mix(in srgb,var(--cyan) 10%,var(--panel2));border-color:color-mix(in srgb,var(--cyan) 25%,transparent)}.chatItem small{color:var(--muted);font-size:7px}.chatEmpty{padding:12px;color:var(--muted);font-size:9px;text-align:center}.aiMessages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.aiMsg{max-width:88%;padding:10px 12px;border-radius:15px;line-height:1.65;font-size:11px;white-space:pre-wrap;word-break:break-word}.aiMsg.user{align-self:flex-start;background:color-mix(in srgb,var(--cyan) 14%,var(--panel2));border:1px solid color-mix(in srgb,var(--cyan) 22%,transparent)}.aiMsg.agent{align-self:flex-end;background:color-mix(in srgb,var(--gold) 10%,var(--panel2));border:1px solid color-mix(in srgb,var(--gold) 25%,transparent)}.aiComposer{display:flex;gap:7px;padding:10px;border-top:1px solid color-mix(in srgb,var(--cyan) 20%,transparent)}.aiComposer textarea{flex:1;min-height:42px;max-height:90px;resize:none;border:1px solid color-mix(in srgb,var(--cyan) 25%,transparent);border-radius:13px;background:var(--bg);color:var(--text);padding:10px;font:inherit;font-size:11px;outline:none}.aiComposer button{border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:13px;background:var(--panel2);padding:0 13px;font-weight:950}.aiComposer button:disabled{opacity:.45}</style></head><body><div class="scene"><div class="top"><div><div class="brand">عمار</div><div class="sub">مركز القيادة الذكي</div></div><div class="pill live"><i class="dot"></i>النظام جاهز</div><div class="pill clock" id="clock">00:00</div></div><div class="coreWrap"><div class="orbit"></div><div class="core"><div class="coreTitle">عمار</div><div class="coreValue">مركز القيادة</div><div class="coreState">● متصل ونشط</div></div></div><div class="nodes"><button class="node left1" onclick="openRoom('CHART')">الرسم<br>البياني</button><button class="node left2" onclick="openRoom('NEWS_SESSIONS')">غرفة<br>الأخبار</button><button class="node left3" onclick="openRoom('MARKET')">غرفة<br>السوق</button><button class="node left4 future" onclick="openRoom('FUTURE_LEFT')" aria-label="مساحة قابلة للتخصيص 1">＋</button><button class="node right1" onclick="openRoom('BOT_LAB')">مختبر<br>البوتات</button><button class="node right2" onclick="openRoom('ANALYSIS')">غرفة<br>AI</button><button class="node right3" onclick="openRoom('SETTINGS')">الإعدادات</button><button class="node right4 future" onclick="openRoom('FUTURE_RIGHT')" aria-label="مساحة قابلة للتخصيص 2">＋</button></div><div class="panel"><button class="action primary" onclick="openRoom('COMMAND_CENTER')"><b>⌂</b>مركز القيادة</button><button class="action" onclick="openRoom('POSITIONS')"><b>◉</b>الصفقات</button><button class="action" onclick="openRoom('PERFORMANCE')"><b>↗</b>الأداء</button><button class="action danger" onclick="openRoom('RISK')"><b>!</b>المخاطر</button></div><button class="aiLauncher" id="aiLauncher" onclick="toggleAgent()">✦ AMAR AI</button><section class="aiChat" id="aiChat" aria-label="AMAR AI"><div class="aiHead"><div><b>AMAR AI</b><div class="aiStatus" id="aiStatus">Agent: جاهز</div></div><div class="chatTools"><button onclick="toggleChatList()">المحادثات</button><button onclick="newChat()">＋</button><button class="aiClose" onclick="toggleAgent()" aria-label="إغلاق">×</button></div><div class="chatList" id="chatList"></div><div class="aiMessages" id="aiMessages"><div class="aiMsg agent">مرحباً. اكتب طلبك ليتم تمريره إلى AMAR AI Agent Engine.</div></div><div class="aiComposer"><textarea id="aiPrompt" placeholder="اكتب سؤالك هنا…" onkeydown="agentKey(event)"></textarea><button id="aiSend" onclick="askAgentFromUi()">إرسال</button></div></section><div class="toast" id="toast">جاهز</div></div><script>let t;
const CHAT_STORAGE_KEY='amar_ai_chat_history_v1';
let chats=[],activeChatId=null;
function loadChats(){try{chats=JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY)||'[]')}catch(_){chats=[]}if(!Array.isArray(chats))chats=[];if(!chats.length)newChat(false);else{activeChatId=chats[0].id;renderChatList();renderActiveChat()}}
function persistChats(){localStorage.setItem(CHAT_STORAGE_KEY,JSON.stringify(chats))}
function makeChat(title){return {id:'chat_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),title:title||('دردشة '+(chats.length+1)),messages:[],createdAt:Date.now(),updatedAt:Date.now()}}
function newChat(save=true){const c=makeChat();chats.unshift(c);activeChatId=c.id;if(save)persistChats();renderChatList();renderActiveChat();toggleChatList(false);setAgentStatus('Agent: جاهز')}
function activeChat(){return chats.find(c=>c.id===activeChatId)||null}
function selectChat(id){if(chats.some(c=>c.id===id)){activeChatId=id;persistChats();renderChatList();renderActiveChat();toggleChatList(false);setAgentStatus('Agent: جاهز')}}
function saveMessage(text,kind){const c=activeChat();if(!c)return;c.messages.push({t:String(text||''),kind});if(kind==='user'&&c.title.startsWith('دردشة ')){const s=String(text||'').replace(/\s+/g,' ').trim();if(s)c.title=s.slice(0,28)}c.updatedAt=Date.now();persistChats();renderChatList()}
function renderChatList(){const box=document.getElementById('chatList');if(!box)return;box.innerHTML='<button class="chatNew" onclick="newChat()">＋ محادثة جديدة</button>'+(chats.length?chats.map(c=>'<button class="chatItem '+(c.id===activeChatId?'active':'')+'" onclick="selectChat(\''+c.id+'\')"><span>'+escapeHtml(c.title)+'</span><small>'+c.messages.length+' رسالة</small></button>').join(''):'<div class="chatEmpty">لا توجد محادثات محفوظة.</div>')}
function renderActiveChat(){const box=document.getElementById('aiMessages');if(!box)return;const c=activeChat();if(!c){box.innerHTML='<div class="aiMsg agent">مرحباً. ابدأ محادثة جديدة.</div>';return}box.innerHTML=c.messages.length?c.messages.map(m=>'<div class="aiMsg '+(m.kind==='user'?'user':'agent')+'">'+escapeHtml(m.t)+'</div>').join(''):'<div class="aiMsg agent">مرحباً. هذه دردشة محفوظة ويمكنك العودة إليها متى شئت.</div>';box.scrollTop=box.scrollHeight}
function toggleChatList(force){const e=document.getElementById('chatList');if(!e)return;e.classList.toggle('open',typeof force==='boolean'?force:!e.classList.contains('open'));if(e.classList.contains('open'))renderChatList()}
function show(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(t);t=setTimeout(()=>e.classList.remove('show'),1100)}function openRoom(x){if(window.Android&&typeof Android.openRoom==='function'){Android.openRoom(x)}else{show('واجهة التطبيق غير متصلة')}}function setTheme(mode){document.body.classList.toggle('light',String(mode).toUpperCase()==='LIGHT')}function amarAiSetBackground(v){const value=String(v||'').trim();if(!value)return;document.body.dataset.background=value;document.documentElement.style.setProperty('--amar-background',value);document.querySelector('.scene').style.background=value}function amarAiSetAccentColor(v){const value=String(v||'').trim();if(!value)return;document.body.dataset.accent=value;document.documentElement.style.setProperty('--cyan',value)}function amarAiRequestUpdate(){show('تم طلب التحديث')}window.amarAiSetBackground=amarAiSetBackground;window.amarAiSetAccentColor=amarAiSetAccentColor;window.amarAiRequestUpdate=amarAiRequestUpdate;window.setTheme=setTheme;window.openRoom=openRoom;function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}updateClock();setInterval(updateClock,1000);function toggleAgent(){document.getElementById('aiChat').classList.toggle('open');if(document.getElementById('aiChat').classList.contains('open')){loadChats();setTimeout(()=>document.getElementById('aiPrompt').focus(),50)}}function appendAgentMessage(text,kind){const box=document.getElementById('aiMessages');const m=document.createElement('div');m.className='aiMsg '+kind;m.textContent=String(text||'');box.appendChild(m);box.scrollTop=box.scrollHeight;saveMessage(text,kind)}function setAgentStatus(status){const e=document.getElementById('aiStatus');if(e)e.textContent=status||'Agent: جاهز'}function askAgentFromUi(){const input=document.getElementById('aiPrompt');const send=document.getElementById('aiSend');const text=String(input.value||'').trim();if(!text||send.disabled)return;if(!(window.Android&&typeof Android.ask==='function')){setAgentStatus('Agent: غير متصل');appendAgentMessage('جسر AMAR AI غير متصل في هذه النسخة.','agent');return}appendAgentMessage(text,'user');input.value='';send.disabled=true;setAgentStatus('Agent: يعالج الطلب…');Android.ask(text)}function agentKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();askAgentFromUi()}}function receiveAgent(text,status){appendAgentMessage(text,'agent');setAgentStatus(status||'Agent: تم');const send=document.getElementById('aiSend');if(send)send.disabled=false}window.receiveAgent=receiveAgent;window.setAgentStatus=setAgentStatus;loadChats();</script></body></html>
