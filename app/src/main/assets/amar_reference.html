<!doctype html><html lang="ar" dir="rtl"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{--bg:#050711;--ink:#eaf6ff;--muted:#7890a5;--cyan:#36e7ff;--violet:#9b7cff;--gold:#ffd36a;--mint:#55f2c1;--red:#ff6680}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans Arabic',sans-serif}button{font:inherit;color:inherit;border:0;outline:0}.scene{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 38%,#1a2a48,#0b1122 32%,#050711 72%,#020308)}.scene:before{content:'';position:absolute;inset:-30%;background:conic-gradient(from 20deg,transparent,#36e7ff10,transparent,#9b7cff12,transparent,#ffd36a09,transparent);animation:neb 18s linear infinite}.grid{position:absolute;inset:42% -20% -25%;opacity:.2;background-image:linear-gradient(#7bdcff0b 1px,transparent 1px),linear-gradient(90deg,#7bdcff0b 1px,transparent 1px);background-size:34px 34px;transform:perspective(500px) rotateX(58deg) scale(1.7);transform-origin:center bottom}.top{position:absolute;top:2.2%;left:4%;right:4%;height:9%;display:flex;align-items:center;justify-content:space-between;z-index:20}.brand{display:flex;align-items:center;gap:8px}.mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#36e7ff,#7868ff);box-shadow:0 0 28px #36e7ff35;position:relative}.mark:after{content:'';position:absolute;inset:9px;border:1px solid #fff9;border-radius:50%}.brandText{font-size:clamp(23px,6vw,35px);font-weight:1000;background:linear-gradient(90deg,#fff,var(--cyan),var(--violet));-webkit-background-clip:text;color:transparent}.sub{font-size:7px;color:var(--muted);font-weight:800}.topRight{display:flex;gap:6px}.pill{border:1px solid #79e2ff22;background:#080e1ccc;backdrop-filter:blur(18px);border-radius:15px;padding:7px 9px;font-size:8px;font-weight:900}.live{display:flex;gap:6px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 15px var(--mint);animation:pulse 1.5s infinite}.clock{direction:ltr;color:var(--cyan)}.hud{position:absolute;top:14%;left:4%;right:4%;display:flex;justify-content:space-between;z-index:15}.hudCard{width:29%;max-width:132px;padding:8px;border:1px solid #79e2ff20;border-radius:14px;background:#0d1426a8;backdrop-filter:blur(16px);box-shadow:inset 0 1px #fff1}.hudCard small{display:block;color:var(--muted);font-size:7px;font-weight:800}.hudCard b{display:block;margin-top:3px;font-size:10px}.positive b{color:var(--mint)}.accent b{color:var(--gold)}.aiGate{position:absolute;top:12%;left:50%;transform:translateX(-50%);z-index:24}.aiBtn,.newsBtn{height:40px;border-radius:16px;background:linear-gradient(135deg,#182a46ee,#0a1122ee);border:1px solid #36e7ff66;box-shadow:0 0 25px #36e7ff19,inset 0 1px #fff2;display:flex;align-items:center;justify-content:center;gap:6px;font-size:8px;font-weight:1000;backdrop-filter:blur(18px);animation:float 3.8s ease-in-out infinite}.aiBtn{width:82px}.aiDot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}.newsGate{position:absolute;top:12%;right:4%;z-index:24}.newsBtn{width:92px;border-color:#9b7cff55;background:linear-gradient(135deg,#241d3eee,#101327ee);animation-delay:.5s}.newsBtn i{width:8px;height:8px;border-radius:3px;background:var(--violet);box-shadow:0 0 14px var(--violet)}.coreWrap{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(63vw,280px);aspect-ratio:1;z-index:8}.ring,.ring2{position:absolute;border-radius:50%}.ring{inset:-7%;border:1px solid #36e7ff42;box-shadow:0 0 45px #36e7ff12;animation:spin 22s linear infinite}.ring:before,.ring:after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 20px var(--cyan)}.ring:before{left:18%;top:7%}.ring:after{right:8%;bottom:22%;background:var(--gold);box-shadow:0 0 20px var(--gold)}.ring2{inset:6%;border:1px dashed #9b7cff44;animation:spin 14s linear infinite reverse}.core{position:absolute;inset:17%;border-radius:42% 58% 55% 45%;transform:rotate(4deg);background:radial-gradient(circle at 35% 24%,#294765,#142239 30%,#080c18 75%);border:1px solid #72eaff7a;box-shadow:0 0 0 1px #fff1 inset,0 0 55px #36e7ff1d,0 0 110px #8b72ff10;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:core 4.8s ease-in-out infinite}.core:before{content:'';position:absolute;width:130%;height:45%;top:28%;left:-15%;background:linear-gradient(90deg,transparent,#36e7ff20,transparent);transform:rotate(-16deg);animation:sweep 3.8s ease-in-out infinite}.core:after{content:'';position:absolute;inset:13%;border:1px solid #fff1;border-radius:50%}.coreTitle{font-size:31px;font-weight:1000;text-shadow:0 0 22px #36e7ff55}.coreLabel{font-size:8px;color:var(--cyan);font-weight:900}.coreState{margin-top:12px;padding:6px 13px;border-radius:99px;border:1px solid #55f2c144;background:#55f2c10c;color:var(--mint);font-size:8px;font-weight:950}.nodes{position:absolute;inset:27% 3% 22%;z-index:12}.node{position:absolute;width:67px;height:67px;border-radius:20px;background:linear-gradient(145deg,#14243acc,#080d18cc);border:1px solid #73dfff2b;box-shadow:0 10px 35px #0007,inset 0 1px #fff2;backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:950;color:#cbeeff}.node b{font-size:17px;margin-bottom:3px;color:var(--cyan)}.node:active{scale:.9}.n1{left:2%;top:12%}.n2{right:2%;top:12%}.n3{left:1%;bottom:8%}.n4{right:1%;bottom:8%}.n5{left:50%;top:0;transform:translateX(-50%)}.n6{left:50%;bottom:0;transform:translateX(-50%)}.dock{position:absolute;bottom:2.6%;left:4%;right:4%;height:67px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;z-index:25;padding:6px;border:1px solid #74dfff20;border-radius:22px;background:linear-gradient(145deg,#121c31cc,#070b15dd);backdrop-filter:blur(22px);box-shadow:0 18px 45px #0009,inset 0 1px #fff2}.dockBtn{border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;font-weight:900;color:#8eaabd}.dockBtn b{font-size:17px;line-height:18px;color:#b7d9e7}.dockBtn.active{background:#36e7ff0d;border:1px solid #36e7ff20;color:#e8fbff}.dockBtn.active b{color:var(--cyan)}.warn b{color:var(--red)}.toast{position:absolute;left:50%;top:68%;transform:translate(-50%,10px);opacity:0;padding:9px 16px;border-radius:18px;background:#0a1120ee;border:1px solid #36e7ff44;font-size:9px;font-weight:950;z-index:40;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes neb{to{transform:rotate(360deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 0 7px transparent,0 0 18px var(--mint)}}@keyframes core{50%{translate:0 -5px;filter:brightness(1.08)}}@keyframes sweep{50%{translate:35% 0}}@keyframes float{50%{translate:0 -4px;filter:brightness(1.12)}}@media(max-width:520px){.hud{top:15%}.coreWrap{top:48%;width:min(62vw,265px)}.nodes{inset:29% 2% 22%}.node{width:62px;height:62px}.aiGate,.newsGate{top:11.5%}.newsGate{right:3%}.aiBtn,.newsBtn{height:37px;width:78px}.dock{bottom:2%;height:64px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><div class="scene"><div class="grid"></div><header class="top"><div class="brand"><div class="mark"></div><div><div class="brandText">عمار</div><div class="sub">AI COMMAND ROOM · HOME</div></div></div><div class="topRight"><div class="pill live"><i class="dot"></i>النظام جاهز</div><div class="pill clock" id="clock">00:00</div></div></header><div class="hud"><div class="hudCard positive"><small>حالة النظام</small><b>مستقر · متصل</b></div><div class="hudCard accent"><small>المحور النشط</small><b>غرفة القيادة</b></div><div class="hudCard"><small>الحماية</small><b>مفعّلة</b></div></div><div class="aiGate"><button class="aiBtn" onclick="openRoom('ANALYSIS')"><span class="aiDot"></span>غرفة AI</button></div><div class="newsGate"><button class="newsBtn" onclick="openRoom('MARKET')"><i></i>الأخبار والجلسات</button></div><main class="coreWrap"><div class="ring"></div><div class="ring2"></div><div class="core"><div class="coreTitle">عمار</div><div class="coreLabel">AI COMMAND CORE</div><div class="coreState">● متصل ونشط</div></div></main><div class="nodes"><button class="node n1" onclick="openRoom('CHART')"><b>⌁</b>الرسم<br>البياني</button><button class="node n2" onclick="openRoom('BOT_LAB')"><b>◈</b>مختبر<br>البوتات</button><button class="node n3" onclick="openRoom('POSITIONS')"><b>◉</b>الصفقات</button><button class="node n4" onclick="openRoom('RISK')"><b>!</b>المخاطر</button><button class="node n5" onclick="openRoom('ACCOUNTS')"><b>◇</b>الحسابات</button><button class="node n6" onclick="openRoom('SETTINGS')"><b>⚙</b>الإعدادات</button></div><nav class="dock"><button class="dockBtn active" onclick="openRoom('COMMAND_CENTER')"><b>⌂</b>الرئيسية</button><button class="dockBtn" onclick="openRoom('PERFORMANCE')"><b>↗</b>الأداء</button><button class="dockBtn" onclick="openRoom('ANALYSIS')"><b>◎</b>التحليل</button><button class="dockBtn" onclick="openRoom('MARKET')"><b>◌</b>السوق</button><button class="dockBtn warn" onclick="openRoom('RISK')"><b>!</b>الحماية</button></nav><div class="toast" id="toast">جاهز</div></div><script>let toastTimer;function show(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1200)}function openRoom(x){if(window.Android&&Android.openRoom){Android.openRoom(x)}else{show('الوحدة غير متاحة بعد')}}function setTheme(mode){document.body.classList.toggle('light',mode==='LIGHT')}function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}updateClock();setInterval(updateClock,1000)</script></body></html>
