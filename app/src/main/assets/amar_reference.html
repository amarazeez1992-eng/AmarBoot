<!doctype html><html lang="en" dir="ltr"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{--bg:#030406;--bg2:#090c12;--panel:#0b0f16;--panel2:#111722;--white:#f7f4ea;--muted:#9da4ad;--gold:#d8ad52;--gold2:#fff0ad;--cyan:#7eeaff;--violet:#b98cff;--red:#ff6477}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,'Noto Sans',sans-serif}button{font:inherit;color:inherit;border:0}.scene{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 44%,#1a2029 0,#0c1119 27%,#05070b 62%,#010203 100%)}.scene:before{content:'';position:absolute;inset:-25%;background:conic-gradient(from 0deg,transparent,#d8ad5220,transparent,#7eeaff18,transparent,#b98cff18,transparent);animation:slowSpin 28s linear infinite}.scene:after{content:'';position:absolute;width:120vw;height:120vw;left:-10vw;top:18%;border:1px solid #d8ad5230;border-radius:50%;box-shadow:0 0 100px #d8ad5210, inset 0 0 90px #7eeaff08;pointer-events:none}.top{position:absolute;top:2.5%;left:4%;right:4%;height:8%;display:flex;align-items:center;justify-content:space-between;z-index:20}.brand{font-size:clamp(22px,6vw,34px);font-weight:1000;letter-spacing:2px;background:linear-gradient(100deg,#fff,var(--gold2),var(--gold),#fff);-webkit-background-clip:text;color:transparent;text-shadow:0 0 22px #d8ad5240}.sub{font-size:8px;letter-spacing:1.5px;color:var(--muted);font-weight:800}.status,.clock{border:1px solid #d8ad5245;background:#090c12cc;backdrop-filter:blur(12px);border-radius:20px;padding:8px 11px;font-size:9px;font-weight:900}.status{display:flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;background:#62f5b4;box-shadow:0 0 15px #62f5b4;animation:pulse 1.7s infinite}.clock{color:var(--gold2);letter-spacing:1px;direction:ltr}.coreWrap{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:min(62vw,278px);aspect-ratio:1;z-index:8}.ring{position:absolute;inset:0;border-radius:50%;border:1px solid #d8ad5260;box-shadow:0 0 35px #d8ad5217;animation:spin 18s linear infinite}.ring.r2{inset:6%;border-color:#7eeaff45;animation-duration:13s;animation-direction:reverse}.ring.r3{inset:13%;border-style:dashed;border-color:#b98cff45;animation-duration:9s}.core{position:absolute;inset:18%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 34% 25%,#fff8cf 0,#d7ad55 8%,#75602e 20%,#24201a 39%,#0d1015 68%,#030406 100%);border:2px solid #f3d47e;box-shadow:0 0 0 4px #d8ad5216,0 0 55px #d8ad5240,0 0 90px #7eeaff22;overflow:hidden;cursor:pointer;animation:coreFloat 4.8s ease-in-out infinite,coreGlow 3.2s ease-in-out infinite}.core:before{content:'';position:absolute;width:72%;height:72%;border:1px solid #fff2b85c;border-radius:50%;animation:spin 12s linear infinite}.core:after{content:'';position:absolute;left:-40%;top:-10%;width:38%;height:130%;background:linear-gradient(90deg,transparent,#fff8d980,transparent);transform:rotate(22deg);animation:sheen 4s ease-in-out infinite}.coreTitle{position:relative;z-index:2;font-size:clamp(27px,8vw,42px);font-weight:1000;letter-spacing:2px;color:#fff7d0;text-shadow:0 0 8px #fff,0 0 22px #d8ad52,0 0 42px #fff2ad}.coreSub{position:relative;z-index:2;margin-top:3px;font-size:8px;letter-spacing:2px;color:#080808;font-weight:1000;background:#fff0adcc;padding:4px 8px;border-radius:10px}.coreState{position:relative;z-index:2;margin-top:9px;font-size:8px;color:#e9ffff;letter-spacing:1px}.nodes{position:absolute;inset:13% 4% 20%;z-index:12}.node{position:absolute;width:78px;height:78px;border-radius:24px;background:linear-gradient(145deg,#171c25dd,#07090dcc);border:1px solid #d8ad5245;box-shadow:0 12px 30px #0008,0 0 20px #7eeaff0d;backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:950;color:#edf6f8;transition:.25s;animation:nodeFloat 4s ease-in-out infinite}.node b{font-size:18px;color:var(--gold2);margin-bottom:4px}.node:active{scale:.92;border-color:#fff0ad;box-shadow:0 0 28px #d8ad5250}.n1{left:1%;top:13%}.n2{right:1%;top:13%;animation-delay:.6s}.n3{left:1%;bottom:5%;animation-delay:1.1s}.n4{right:1%;bottom:5%;animation-delay:1.7s}.n5{left:50%;top:0;transform:translateX(-50%);animation-delay:2.2s}.n6{left:50%;bottom:-2%;transform:translateX(-50%);animation-delay:2.8s}.agent{position:absolute;left:50%;top:13%;transform:translateX(-50%);z-index:18;padding:8px 16px;border-radius:20px;background:#0a0d13dd;border:1px solid #7eeaff55;box-shadow:0 0 25px #7eeaff18;color:#dffcff;font-size:9px;font-weight:1000;letter-spacing:.8px}.agent:active{scale:.95}.bottom{position:absolute;left:4%;right:4%;bottom:3%;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.action{min-height:54px;border-radius:17px;background:linear-gradient(145deg,#141923e8,#07090de8);border:1px solid #7eeaff28;box-shadow:0 8px 24px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;font-weight:900;color:#cbd8de}.action b{font-size:16px;color:var(--gold2);margin-bottom:2px}.action.primary{border-color:#d8ad5260}.hide{position:absolute;right:4%;bottom:13.5%;z-index:22;width:34px;height:34px;border-radius:50%;background:#090c12e8;border:1px solid #7eeaff50;color:#fff}.hidden-ui .nodes,.hidden-ui .bottom{opacity:0;pointer-events:none}.decision{position:absolute;right:50%;top:26%;transform:translateX(50%);z-index:17;padding:8px 13px;border-radius:16px;background:linear-gradient(145deg,#d8ad52,#4e3918);border:1px solid #fff0ad;box-shadow:0 0 28px #d8ad5240;color:#090909;font-size:8px;font-weight:1000;letter-spacing:1px;animation:decisionPulse 2.8s ease-in-out infinite}.toast{position:absolute;left:50%;top:67%;transform:translate(-50%,15px);opacity:0;padding:9px 15px;border-radius:18px;background:#0b1018ee;border:1px solid #d8ad5250;font-size:9px;font-weight:900;z-index:30;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{box-shadow:0 0 0 6px transparent,0 0 18px #62f5b4}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes slowSpin{to{transform:rotate(360deg)}}@keyframes coreFloat{50%{transform:translateY(-6px) rotateX(4deg) rotateY(-3deg)}}@keyframes coreGlow{50%{filter:brightness(1.2)}}@keyframes sheen{0%,100%{left:-40%;opacity:0}35%{opacity:1}65%{left:120%;opacity:0}}@keyframes nodeFloat{50%{translate:0 -5px}}@keyframes decisionPulse{50%{box-shadow:0 0 18px #d8ad5250,0 0 40px #fff0ad18;filter:brightness(1.18)}}body.light{--bg:#edf2f4;--bg2:#e5edf0;--panel:#fff;--panel2:#edf5f7;--white:#122028;--muted:#5c6c74}body.light .scene{background:radial-gradient(circle at 50% 44%,#fff 0,#eaf2f4 45%,#dce7ea 100%)}body.light .node,.light .action,.light .status,.light .clock{background:#ffffffd9;color:#15252c}body.light .core{background:radial-gradient(circle at 34% 25%,#fff 0,#e8cf87 12%,#b9903b 27%,#f7f3e8 55%,#fff 100%)}@media(max-height:650px){.coreWrap{width:min(54vw,230px);top:42%}.node{width:68px;height:68px}.decision{top:24%}.bottom{bottom:2%}.action{min-height:48px}}</style></head><body><div class="scene"><div class="top"><div><div class="brand">AMAR AI</div><div class="sub">CENTRAL INTELLIGENCE • COMMAND SPACE</div></div><div class="status"><i class="dot"></i>ONLINE</div><div class="clock" id="clock">00:00:00</div></div><button class="agent" onclick="openRoom('AMAR_AGENT')">AMAR AI AGENT • CENTRAL AUTHORITY</button><button class="decision" onclick="openRoom('DECISION')">DECISION ROOM</button><div class="coreWrap" onclick="openRoom('AMAR_AGENT')"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"><div class="coreTitle">AMAR AI</div><div class="coreSub">CENTRAL INTELLIGENCE</div><div class="coreState">● ONLINE • READY • FAIL-CLOSED</div></div></div><div class="nodes"><button class="node n1" onclick="openRoom('MARKET')"><b>◈</b>MARKET</button><button class="node n2" onclick="openRoom('BOT_LAB')"><b>⌘</b>BOT LAB</button><button class="node n3" onclick="openRoom('INDICATORS')"><b>⌁</b>INDICATORS</button><button class="node n4" onclick="openRoom('LIBRARY')"><b>▦</b>LIBRARY</button><button class="node n5" onclick="openRoom('ANALYSIS')"><b>◌</b>ANALYSIS</button><button class="node n6" onclick="openRoom('SETTINGS')"><b>⚙</b>SETTINGS</button></div><button class="hide" onclick="toggleUi()" aria-label="Hide or show interface">◉</button><div class="bottom"><button class="action primary" onclick="openRoom('COMMAND_CENTER')"><b>⌂</b>COMMAND</button><button class="action" onclick="openRoom('POSITIONS')"><b>◉</b>POSITIONS</button><button class="action" onclick="openRoom('PERFORMANCE')"><b>↗</b>PERFORMANCE</button><button class="action" onclick="openRoom('RISK')"><b>!</b>RISK</button></div><div class="toast" id="toast">READY</div></div><script>let t;function openRoom(x){if(window.Android&&Android.openRoom){Android.openRoom(x)}else{show('Android Agent bridge unavailable')}}function show(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(t);t=setTimeout(()=>e.classList.remove('show'),1200)}function toggleUi(){document.querySelector('.scene').classList.toggle('hidden-ui');show(document.querySelector('.scene').classList.contains('hidden-ui')?'TOOLS HIDDEN':'TOOLS VISIBLE')}function setTheme(mode){document.body.classList.toggle('light',mode==='LIGHT')}function setVisualEffectsEnabled(enabled){document.documentElement.style.setProperty('--effects',enabled?'1':'0');document.querySelector('.scene').style.setProperty('--effects',enabled?'1':'0')}function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}updateClock();setInterval(updateClock,1000)</script></body></html>
