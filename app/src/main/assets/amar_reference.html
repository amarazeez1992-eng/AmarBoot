<!doctype html><html lang="ar" dir="rtl"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Noto Sans Arabic',sans-serif}body{background:linear-gradient(180deg,#f7feff 0%,#d9f5f2 45%,#dfe9ce 68%,#f4dfb8 100%);color:#174a52}.scene{position:relative;width:100%;height:100%;overflow:hidden}.sun{position:absolute;width:62vw;height:62vw;max-width:430px;max-height:430px;border-radius:50%;left:50%;top:33%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0%,#d8fff8 35%,rgba(107,224,207,.18) 68%,transparent 72%);filter:blur(2px);animation:breathe 3s ease-in-out infinite}.hill{position:absolute;left:-12%;right:-12%;height:38%;border-radius:50% 50% 0 0/80% 80% 0 0;bottom:11%;background:linear-gradient(180deg,rgba(72,169,147,.28),rgba(105,145,105,.36));transform:rotate(-2deg)}.hill2{bottom:-5%;background:linear-gradient(180deg,rgba(98,143,113,.38),rgba(227,205,156,.65));transform:rotate(2deg)}.horizon{position:absolute;left:18%;right:18%;top:58%;height:2px;background:#e7bb42;box-shadow:0 0 12px #f3ce69}.glass{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.85);box-shadow:0 12px 30px rgba(33,92,88,.12),inset 0 1px 0 #fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.top{position:absolute;top:12px;left:14px;right:14px;height:52px;border-radius:28px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;z-index:20;font-size:11px;font-weight:700}.status{color:#087d70}.gear{font-size:19px}.brand{position:absolute;top:78px;left:0;right:0;text-align:center;z-index:10}.brand b{display:block;font-size:38px;color:#b98619;line-height:1.05}.brand span{font-size:13px;font-weight:800}.demo{display:inline-block;margin-top:7px;padding:6px 19px;border-radius:18px;background:#19aa88;color:white;font-size:11px;box-shadow:0 6px 18px rgba(25,170,136,.25)}.core{position:absolute;left:50%;top:49%;width:min(42vw,260px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:8;display:flex;align-items:center;justify-content:center;cursor:pointer}.orb{width:68%;height:68%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a5fff2 0,#39d7c8 30%,#129d99 58%,#07566c 100%);box-shadow:0 0 35px rgba(37,214,197,.42),inset -18px -15px 28px rgba(0,35,70,.25),inset 10px 8px 22px rgba(255,255,255,.5);animation:float 3.2s ease-in-out infinite}.ring{position:absolute;inset:6%;border:2px solid rgba(255,211,91,.58);border-radius:50%;animation:spin 9s linear infinite}.ring:after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:#ffd35a;top:-5px;left:50%;box-shadow:0 0 12px #ffd35a}.node{position:absolute;width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:800;z-index:15;cursor:pointer;transition:.25s;user-select:none}.node:active{transform:scale(.92)}.node.active{box-shadow:0 0 0 4px rgba(25,170,136,.18),0 14px 30px rgba(22,100,90,.18);transform:scale(1.08)}.n1{top:29%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.74)}.n2{top:38%;left:9%;background:rgba(255,255,255,.74)}.n3{top:38%;right:9%;background:rgba(255,255,255,.74)}.n4{bottom:22%;left:12%;background:rgba(255,255,255,.74)}.n5{bottom:22%;right:12%;background:rgba(255,255,255,.74)}.footer{position:absolute;bottom:9px;left:10px;right:10px;height:64px;border-radius:32px;z-index:30;display:flex;align-items:center;justify-content:space-around;padding:5px}.nav{min-width:58px;height:52px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:700;cursor:pointer}.nav.active{background:#dcf5ef;color:#0a8978}.dot{font-size:10px;margin-bottom:2px}.clock{position:absolute;top:15px;left:42px;z-index:31;color:#174a52;background:rgba(248,251,251,.88);border-radius:8px;padding:1px 5px;font-size:20px;font-weight:800;line-height:1.15;pointer-events:none}.toast{position:absolute;left:50%;top:63%;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:9px 16px;border-radius:18px;background:rgba(255,255,255,.9);box-shadow:0 10px 25px rgba(0,0,0,.12);font-size:11px;font-weight:800;z-index:40;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.9}}@keyframes float{50%{transform:translateY(-5px) scale(1.03)}}@media(max-height:700px){.brand{top:68px}.brand b{font-size:31px}.core{top:48%}.node{width:70px;height:70px}.footer{height:58px}.n4,.n5{bottom:20%}.clock{top:10px;left:34px;font-size:17px}}</style></head><body><div class="scene"><div class="sun"></div><div class="hill"></div><div class="hill hill2"></div><div class="horizon"></div><div class="top glass"><span class="status" onclick="openRoom('COMMAND_CENTER')">● عمار متصل</span><span onclick="openRoom('ACCOUNTS')">الحساب تجريبي</span><span onclick="openRoom('MARKET')">XAUUSD&nbsp; M5&nbsp; ﹀</span><span class="gear" onclick="openRoom('SETTINGS')">⚙</span></div><div id="clock" class="clock">12:45</div><div class="brand"><b>عمار</b><span>منصة التداول الذكية</span><div class="demo">تجريبي</div></div><div class="core" onclick="pulseCore()"><div class="orb"></div><div class="ring"></div></div><div class="node n1 glass" onclick="openRoom('MARKET');selectNode(this)">السوق</div><div class="node n2 glass" onclick="openRoom('BOT_LAB');selectNode(this)">البوت</div><div class="node n3 glass" onclick="openRoom('CHART');selectNode(this)">الرسم<br>البياني</div><div class="node n4 glass" onclick="openRoom('RISK');selectNode(this)">المخاطر</div><div class="node n5 glass" onclick="openRoom('ANALYSIS');selectNode(this)">التحليل</div><div id="toast" class="toast">جاهز</div><div class="footer glass"><div class="nav" onclick="openRoom('SETTINGS');nav(this)"><div class="dot">○</div>الإعدادات</div><div class="nav" onclick="openRoom('ALERTS');nav(this)"><div class="dot">○</div>التنبيهات</div><div class="nav active" onclick="goHome();nav(this)"><div class="dot">●</div>الرئيسية</div><div class="nav" onclick="openRoom('PERFORMANCE');nav(this)"><div class="dot">○</div>الأداء</div><div class="nav" onclick="openMore();nav(this)"><div class="dot">○</div>المزيد</div></div></div><script>let timer;const rooms=[['COMMAND_CENTER','مركز القيادة'],['MARKET','السوق'],['CHART','الرسم البياني'],['BOT_LAB','البوت'],['RISK','المخاطر'],['POSITIONS','الصفقات والأوامر'],['PERFORMANCE','الأداء'],['INDICATORS','المؤشرات'],['ANALYSIS','التحليل'],['TESTING','الاختبار والمحاكاة'],['TOOLS','الأدوات'],['ALERTS','التنبيهات'],['LIBRARY','مكتبة عمار'],['ACCOUNTS','حسابات التداول'],['SETTINGS','الإعدادات']];function show(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>x.classList.remove('show'),1100)}function openRoom(r){if(window.Android&&Android.openRoom){Android.openRoom(r)}else show(rooms.find(x=>x[0]===r)?.[1]||'الغرفة')}function goHome(){if(window.Android&&Android.openHome){Android.openHome()}else show('الرئيسية')}function selectNode(el){document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function nav(el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function pulseCore(){show('مركز عمار يعمل');document.querySelector('.orb').animate([{filter:'brightness(1)'},{filter:'brightness(1.35)'},{filter:'brightness(1)'}],{duration:650})}function openMore(){show('الغرف متصلة عبر النظام');if(window.Android&&Android.openRoom){Android.openRoom('COMMAND_CENTER')}}function updateClock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}updateClock();setInterval(updateClock,1000);</script></body></html>
