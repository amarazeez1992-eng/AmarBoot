<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,'Noto Sans Arabic',sans-serif}body{-webkit-tap-highlight-color:transparent}.scene{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}.reference{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1}.layer{position:absolute;inset:0;z-index:10}.hit{position:absolute;display:block;border:0;background:transparent;cursor:pointer;touch-action:manipulation;outline:none}.hit:active{filter:brightness(1.12)}.statusDot{position:absolute;width:13px;height:13px;border-radius:50%;background:#13d68d;box-shadow:0 0 0 0 rgba(19,214,141,.65),0 0 14px rgba(19,214,141,.9);animation:statusPulse 1.7s infinite;z-index:20}.clockLive{position:absolute;top:1.15%;left:5.3%;min-width:88px;padding:2px 5px;border-radius:9px;background:rgba(248,251,251,.78);color:#174a52;font-size:20px;font-weight:800;line-height:1.15;text-align:center;z-index:22;direction:ltr}.liveRing{position:absolute;border:2px solid rgba(28,219,173,.42);border-radius:50%;animation:liveRipple 2.8s infinite;pointer-events:none}.nodeGlow{position:absolute;border-radius:50%;pointer-events:none;box-shadow:0 0 0 0 rgba(52,226,192,.45);animation:nodePulse 2.6s infinite}.signal{position:absolute;display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:14px;background:rgba(255,255,255,.86);box-shadow:0 5px 18px rgba(25,120,110,.15);color:#087d70;font-size:10px;font-weight:800;opacity:0;transform:translateY(6px);transition:.28s;pointer-events:none;z-index:25}.signal.show{opacity:1;transform:translateY(0)}.signalDot{width:7px;height:7px;border-radius:50%;background:#19c98a;box-shadow:0 0 8px #19c98a}.notifyBadge{position:absolute;min-width:17px;height:17px;padding:0 5px;border-radius:10px;background:#ef5360;color:#fff;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(239,83,96,.35);animation:badgePop .5s ease;z-index:40}.toast{position:absolute;left:50%;top:61%;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:9px 16px;border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 10px 25px rgba(0,0,0,.13);font-size:11px;font-weight:800;color:#174a52;z-index:50;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}.touchRipple{position:absolute;width:22px;height:22px;border:2px solid rgba(21,180,150,.7);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:ripple .65s ease-out forwards;z-index:60}@keyframes statusPulse{0%,100%{box-shadow:0 0 0 0 rgba(19,214,141,.6),0 0 10px rgba(19,214,141,.7)}50%{box-shadow:0 0 0 8px rgba(19,214,141,0),0 0 19px rgba(19,214,141,1)}}@keyframes liveRipple{0%{transform:scale(.72);opacity:.7}100%{transform:scale(1.35);opacity:0}}@keyframes nodePulse{0%,100%{box-shadow:0 0 0 0 rgba(52,226,192,.35)}50%{box-shadow:0 0 0 7px rgba(52,226,192,0)}}@keyframes badgePop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}@keyframes ripple{from{opacity:.9;transform:translate(-50%,-50%) scale(.5)}to{opacity:0;transform:translate(-50%,-50%) scale(3)}}
</style>
</head>
<body>
<div class="scene" id="scene">
<img class="reference" src="amar_home_reference.png.png" alt="واجهة عمار">
<div class="layer" id="layer">
<span class="statusDot" id="statusDot"></span><span class="clockLive" id="clockLive">00:00</span>
<span class="liveRing" id="liveRing"></span><span class="nodeGlow" id="coreGlow"></span>
<span class="signal" id="liveSignal"><i class="signalDot"></i><span id="signalText">النظام حي</span></span>
<span class="notifyBadge" id="notifyBadge">0</span>

<button class="hit" style="top:5%;left:4%;width:30%;height:7%" onclick="tap(event);openRoom('COMMAND_CENTER');show('مركز القيادة حي')"></button>
<button class="hit" style="top:5%;left:31%;width:27%;height:7%" onclick="tap(event);openRoom('ACCOUNTS');show('حسابات التداول')"></button>
<button class="hit" style="top:5%;left:58%;width:22%;height:7%" onclick="tap(event);openRoom('MARKET');show('بيانات السوق')"></button>
<button class="hit" style="top:5%;right:2%;width:14%;height:7%" onclick="tap(event);openRoom('SETTINGS');show('الإعدادات')"></button>

<button class="hit" style="top:43%;left:35%;width:30%;height:18%" onclick="tap(event);openRoom('MARKET');select('السوق');show('السوق')"></button>
<button class="hit" style="top:51%;left:5%;width:29%;height:18%" onclick="tap(event);openRoom('BOT_LAB');select('البوت');show('مختبر البوتات')"></button>
<button class="hit" style="top:51%;right:5%;width:29%;height:18%" onclick="tap(event);openRoom('CHART');select('الرسم البياني');show('الرسم البياني')"></button>
<button class="hit" style="top:70%;left:10%;width:29%;height:18%" onclick="tap(event);openRoom('RISK');select('المخاطر');show('المخاطر')"></button>
<button class="hit" style="top:70%;right:10%;width:29%;height:18%" onclick="tap(event);openRoom('ANALYSIS');select('التحليل');show('التحليل')"></button>
<button class="hit" style="top:54%;left:35%;width:30%;height:23%" onclick="tap(event);pulseCore();openRoom('COMMAND_CENTER')"></button>

<button class="hit" style="bottom:2%;left:2%;width:18%;height:11%" onclick="tap(event);openRoom('SETTINGS');show('الإعدادات')"></button>
<button class="hit" style="bottom:2%;left:21%;width:18%;height:11%" onclick="tap(event);openRoom('ALERTS');show('التنبيهات')"></button>
<button class="hit" style="bottom:2%;left:40%;width:20%;height:12%" onclick="tap(event);goHome();show('الرئيسية')"></button>
<button class="hit" style="bottom:2%;right:21%;width:18%;height:11%" onclick="tap(event);openRoom('PERFORMANCE');show('الأداء')"></button>
<button class="hit" style="bottom:2%;right:2%;width:18%;height:11%" onclick="tap(event);openMore()"></button>
<div class="toast" id="toast">جاهز</div>
</div></div>
<script>
let timer,signalTimer;const rooms=[['COMMAND_CENTER','مركز القيادة'],['MARKET','السوق'],['CHART','الرسم البياني'],['BOT_LAB','البوت'],['RISK','المخاطر'],['POSITIONS','الصفقات والأوامر'],['PERFORMANCE','الأداء'],['INDICATORS','المؤشرات'],['ANALYSIS','التحليل'],['TESTING','الاختبار والمحاكاة'],['TOOLS','الأدوات'],['ALERTS','التنبيهات'],['LIBRARY','مكتبة عمار'],['ACCOUNTS','حسابات التداول'],['SETTINGS','الإعدادات']];
function show(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>x.classList.remove('show'),1200)}
function openRoom(r){if(window.Android&&Android.openRoom)Android.openRoom(r);else show(rooms.find(x=>x[0]===r)?.[1]||'الغرفة')}
function goHome(){if(window.Android&&Android.openHome)Android.openHome()}
function tap(e){const s=document.createElement('span');s.className='touchRipple';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.getElementById('layer').appendChild(s);setTimeout(()=>s.remove(),700)}
function select(name){document.getElementById('signalText').textContent='نشط: '+name;document.getElementById('liveSignal').classList.add('show');clearTimeout(signalTimer);signalTimer=setTimeout(()=>document.getElementById('liveSignal').classList.remove('show'),1800)}
function pulseCore(){const g=document.getElementById('coreGlow');g.animate([{transform:'scale(.8)',opacity:.3},{transform:'scale(1.25)',opacity:0}],{duration:800,easing:'ease-out'});show('مركز عمار يعمل')}
function openMore(){show('الغرف متصلة بالنظام');openRoom('COMMAND_CENTER')}
function updateClock(){const d=new Date();document.getElementById('clockLive').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}
function positionLive(){const w=innerWidth,h=innerHeight;const d=document.getElementById('statusDot');d.style.left=(w*.086)+'px';d.style.top=(h*.066)+'px';const ring=document.getElementById('liveRing');ring.style.left=(w*.5-55)+'px';ring.style.top=(h*.55-55)+'px';ring.style.width='110px';ring.style.height='110px';const glow=document.getElementById('coreGlow');glow.style.left=(w*.5-70)+'px';glow.style.top=(h*.58-70)+'px';glow.style.width='140px';glow.style.height='140px';const sig=document.getElementById('liveSignal');sig.style.left=(w*.5-45)+'px';sig.style.top=(h*.69)+'px';const badge=document.getElementById('notifyBadge');badge.style.right=(w*.075)+'px';badge.style.top=(h*.815)+'px'}
updateClock();setInterval(updateClock,1000);positionLive();addEventListener('resize',positionLive);setInterval(()=>{const d=document.getElementById('statusDot');d.style.opacity=d.style.opacity==='0.55'?'1':'.55'},900);setTimeout(()=>{document.getElementById('liveSignal').classList.add('show');setTimeout(()=>document.getElementById('liveSignal').classList.remove('show'),1800)},900);
</script>
</body></html>
