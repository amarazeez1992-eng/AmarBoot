name: AMAR AI Stage Two Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  stage-two:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run Stage 2 focused tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.workforce.Stage2SmokeTest' --stacktrace
      - name: Run full AMAR AI agent unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Verify debug build
        run: gradle :app:assembleDebug --stacktrace
