name: Amar temporary Interface B fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared Bot-Lab context to Interface B
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/personal/gridbot/amaros/bots/AmarBotLabInterfaceBScreenV2.kt')
          s = p.read_text()
          old = '            item { BotSelector(selectedBot, onBotSelected) }'
          new = '            item { AmarBotLabGlobalContext() }\n' + old
          if old not in s:
              raise SystemExit('Target line not found')
          if 'item { AmarBotLabGlobalContext() }' in s:
              raise SystemExit('Shared context already present')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/personal/gridbot/amaros/bots/AmarBotLabInterfaceBScreenV2.kt
          git rm .github/workflows/amar-fix-interface-b-shared-context.yml
          git commit -m 'Apply shared Bot Lab constants to Interface B'
          git push
