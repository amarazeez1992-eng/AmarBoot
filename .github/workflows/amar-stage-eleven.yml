name: Amar Stage Eleven

# Stage 11 verification gate: every intelligence layer requires focused regression tests,
# the full unit suite, build verification, architecture checks, and CI evidence before closure.
# Research uses the dedicated evidence-only verification path; no synthetic answer claims are used.
# Item 1 verification trigger: run against the corrected current main baseline before constitutional closure.
# Constitutional re-verification trigger: current main baseline 5b8e3c6d7d4a488d817d1b7913cca89e1f35552f.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/governance/AMAR_PROJECT_CONSTITUTION.md'
      - 'docs/governance/STAGE11_ERROR_PREVENTION_RULES.md'
      - 'docs/verification/STAGE11_ITEM1_INTELLIGENCE_CORE.md'
      - 'docs/verification/STAGE11_ITEM5_REBUILD_SCOPE.md'
      - 'docs/verification/STAGE11_ITEM6_SELF_CRITIQUE_SCOPE.md'
      - '.github/workflows/amar-stage-eleven.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'docs/governance/AMAR_PROJECT_CONSTITUTION.md'
      - 'docs/governance/STAGE11_ERROR_PREVENTION_RULES.md'
      - 'docs/verification/STAGE11_ITEM1_INTELLIGENCE_CORE.md'
      - 'docs/verification/STAGE11_ITEM5_REBUILD_SCOPE.md'
      - 'docs/verification/STAGE11_ITEM6_SELF_CRITIQUE_SCOPE.md'
      - '.github/workflows/amar-stage-eleven.yml'
  workflow_dispatch:

jobs:
  stage-eleven:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Focused Intelligence Core tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.core.AmarIntelligenceCoreTest' --stacktrace

      - name: Focused Verification Layer tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.verification.AmarVerificationLayerTest' --stacktrace

      - name: Focused Advanced Memory tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.memory.AmarAdvancedMemoryTest' --stacktrace

      - name: Focused Deep Research tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.research.AmarDeepResearchOrchestratorTest' --stacktrace

      - name: Focused Decision Intelligence tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.DecisionEngineTest' --stacktrace

      - name: Focused Self-Critique tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarAgentCriticItemSixTest' --stacktrace

      - name: Full unit test suite
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: gradle :app:assembleDebug --stacktrace

      - name: Architecture regression checks
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/governance/AMAR_PROJECT_CONSTITUTION.md
          grep -q '^\*\*Status: BINDING PROJECT LAW\*\*$' docs/governance/AMAR_PROJECT_CONSTITUTION.md
          grep -q 'Architectural Integrity and Professional Standard' docs/governance/AMAR_PROJECT_CONSTITUTION.md
          test -f docs/governance/STAGE11_ERROR_PREVENTION_RULES.md
          test -f docs/verification/STAGE11_ITEM1_INTELLIGENCE_CORE.md
          test -f docs/verification/STAGE11_ITEM5_REBUILD_SCOPE.md
          test -f docs/verification/STAGE11_ITEM6_SELF_CRITIQUE_SCOPE.md
          grep -q '^Status: CLOSED$' docs/verification/STAGE11_ITEM5_REBUILD_SCOPE.md
          grep -q '^Status: CLOSED$' docs/verification/STAGE11_ITEM6_SELF_CRITIQUE_SCOPE.md
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/core/AmarIntelligenceCore.kt
          test -f app/src/test/java/com/personal/gridbot/amaros/intelligence/core/AmarIntelligenceCoreTest.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/verification/AmarVerificationLayer.kt
          test -f app/src/test/java/com/personal/gridbot/amaros/intelligence/verification/AmarVerificationLayerTest.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/memory/AmarAdvancedMemory.kt
          test -f app/src/test/java/com/personal/gridbot/amaros/intelligence/memory/AmarAdvancedMemoryTest.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/research/AmarDeepResearchOrchestrator.kt
          test -f app/src/test/java/com/personal/gridbot/amaros/intelligence/research/AmarDeepResearchOrchestratorTest.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/DecisionEngine.kt
          test -f app/src/test/java/com/personal/gridbot/amaros/intelligence/DecisionEngineTest.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/agent/AmarAgentCritic.kt
          test -f app/src/test/java/com/personal/gridbot/amaros/agent/AmarAgentCriticItemSixTest.kt
          grep -q 'MIN_CLOSES_FOR_VOLATILITY = 4' app/src/main/java/com/personal/gridbot/amaros/intelligence/DecisionEngine.kt
          grep -q 'MIN_LOSSES_FOR_HISTORICAL_VAR = 5' app/src/main/java/com/personal/gridbot/amaros/intelligence/DecisionEngine.kt
          grep -q 'independentSourceCount' app/src/main/java/com/personal/gridbot/amaros/agent/AmarAgentCritic.kt
          grep -q 'evidence_conflict' app/src/main/java/com/personal/gridbot/amaros/agent/AmarAgentCritic.kt
          grep -q 'guarantee_language' app/src/main/java/com/personal/gridbot/amaros/agent/AmarAgentCritic.kt
          test ! -f app/src/main/java/com/personal/gridbot/amaros/intelligence/decision/AmarDecisionEngine2.kt
          test ! -f app/src/test/java/com/personal/gridbot/amaros/intelligence/decision/AmarDecisionEngine2Test.kt
          ! grep -R "OrderSend\|brokerAccessAllowed.*true\|liveTrading.*true" app/src/main/java/com/personal/gridbot/amaros/intelligence/core app/src/main/java/com/personal/gridbot/amaros/intelligence/verification app/src/main/java/com/personal/gridbot/amaros/intelligence/memory app/src/main/java/com/personal/gridbot/amaros/intelligence/research app/src/main/java/com/personal/gridbot/amaros/intelligence
          ! grep -R "executable *= *true" app/src/main/java/com/personal/gridbot/amaros/intelligence
          ! grep -R "OrderSend\|brokerAccessAllowed.*true\|liveTrading.*true" app/src/main/java/com/personal/gridbot/amaros/agent/AmarAgentCritic.kt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amar-stage-eleven-evidence
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
          if-no-files-found: warn
