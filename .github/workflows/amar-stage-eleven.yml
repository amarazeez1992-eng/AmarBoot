name: Amar Stage Eleven

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/governance/**'
      - 'docs/verification/STAGE11_ITEM1_INTELLIGENCE_CORE.md'
      - 'docs/verification/STAGE11_ITEM2_CONFIDENCE_ENGINE.md'
      - 'docs/verification/STAGE11_ITEM3_EVIDENCE_ENGINE.md'
      - '.github/workflows/amar-stage-eleven.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'docs/governance/**'
      - 'docs/verification/STAGE11_ITEM1_INTELLIGENCE_CORE.md'
      - 'docs/verification/STAGE11_ITEM2_CONFIDENCE_ENGINE.md'
      - 'docs/verification/STAGE11_ITEM3_EVIDENCE_ENGINE.md'
      - '.github/workflows/amar-stage-eleven.yml'
  workflow_dispatch:

jobs:
  stage-eleven:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Focused Intelligence Core tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.core.AmarIntelligenceCoreTest' --stacktrace
      - name: Focused Confidence Engine tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.confidence.AmarConfidenceEngineTest' --stacktrace
      - name: Focused Evidence Quality Item 3 tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarEvidenceQualityEngineItem3Test' --stacktrace
      - name: Focused Verification Layer tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.verification.AmarVerificationLayerTest' --stacktrace
      - name: Focused Advanced Memory tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.memory.AmarAdvancedMemoryTest' --stacktrace
      - name: Focused Deep Research tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.research.AmarDeepResearchOrchestratorTest' --stacktrace
      - name: Focused Decision Intelligence tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.DecisionEngineTest' --stacktrace
      - name: Focused Self-Critique tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarAgentCriticItemSixTest' --stacktrace
      - name: Full unit test suite
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Debug build
        run: gradle :app:assembleDebug --stacktrace

      - name: Architecture regression checks
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/governance/AMAR_PROJECT_CONSTITUTION.md
          grep -q '^\*\*Status: BINDING PROJECT LAW\*\*$' docs/governance/AMAR_PROJECT_CONSTITUTION.md
          test -f docs/verification/STAGE11_ITEM1_INTELLIGENCE_CORE.md
          test -f docs/verification/STAGE11_ITEM2_CONFIDENCE_ENGINE.md
          test -f docs/verification/STAGE11_ITEM3_EVIDENCE_ENGINE.md
          grep -q '^\*\*Status: CONSTITUTIONALLY CLOSED\*\*$' docs/verification/STAGE11_ITEM1_INTELLIGENCE_CORE.md
          grep -q '^\*\*Status: CONSTITUTIONALLY CLOSED\*\*$' docs/verification/STAGE11_ITEM2_CONFIDENCE_ENGINE.md
          grep -q '^Status: VERIFICATION IN PROGRESS$' docs/verification/STAGE11_ITEM3_EVIDENCE_ENGINE.md
          test -f app/src/main/java/com/personal/gridbot/amaros/agent/AmarEvidencePolicy.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/agent/AmarStageTwoHardening.kt
          test -f app/src/test/java/com/personal/gridbot/amaros/agent/AmarEvidenceQualityEngineItem3Test.kt
          grep -q 'class AmarEvidenceQualityEngine' app/src/main/java/com/personal/gridbot/amaros/agent/AmarStageTwoHardening.kt
          test ! -f app/src/main/java/com/personal/gridbot/amaros/intelligence/evidence/AmarEvidenceEngine.kt
          test "$(grep -R -l 'class AmarEvidenceQualityEngine' app/src/main/java | wc -l)" -eq 1
          ! grep -R "OrderSend\|brokerAccessAllowed.*true\|liveTrading.*true\|executable *= *true" app/src/main/java/com/personal/gridbot/amaros/agent/AmarEvidencePolicy.kt app/src/main/java/com/personal/gridbot/amaros/agent/AmarStageTwoHardening.kt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amar-stage-eleven-evidence
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
          if-no-files-found: warn
