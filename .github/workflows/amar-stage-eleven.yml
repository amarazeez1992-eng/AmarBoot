name: Amar Stage Eleven

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/governance/**'
      - 'docs/verification/**'
      - 'docs/architecture/**'
      - '.github/workflows/amar-stage-eleven.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'docs/governance/**'
      - 'docs/verification/**'
      - 'docs/architecture/**'
      - '.github/workflows/amar-stage-eleven.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: amar-workflow-stage-eleven-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-eleven:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: amar-stage-eleven-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Focused Intelligence Core tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.core.AmarIntelligenceCoreTest' --stacktrace

      - name: Focused Confidence Engine tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.confidence.AmarConfidenceEngineTest' --stacktrace

      - name: Focused Verification Layer tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.verification.AmarVerificationLayerTest' --stacktrace

      - name: Focused Point 3 Authority Scoring tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarSourceAuthorityTest' --stacktrace

      - name: Focused Point 4 Freshness tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarEvidenceFreshnessTest' --stacktrace

      - name: Focused Point 5 Source Independence tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarSourceIndependenceBoundaryTest' --stacktrace

      - name: Focused Point 6 Duplicate Evidence tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarDuplicateEvidenceDetectorTest' --stacktrace

      - name: Focused Point 7 Fingerprint Integrity tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarFingerprintIntegrityVerifierTest' --stacktrace

      - name: Focused Point 8 Tampering tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.verification.AmarEvidenceTamperingDetectorTest' --stacktrace

      - name: Focused Point 9 Evidence Uniqueness tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.verification.AmarEvidenceUniquenessAnalyzerTest' --stacktrace

      - name: Focused Point 10 Evidence Quality Score tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarEvidenceQualityScoreEngineTest' --stacktrace

      - name: Focused canonical Point 10 assembler tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarCanonicalEvidenceQualityAssemblerTest' --stacktrace

      - name: Focused Point 10 upstream-state contract tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarEvidenceQualityUpstreamStateTest' --stacktrace

      - name: Focused Stage Two Hardening tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarStageTwoHardeningTest' --stacktrace

      - name: Focused Advanced Memory tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.memory.AmarAdvancedMemoryTest' --stacktrace

      - name: Focused Deep Research tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.research.AmarDeepResearchOrchestratorTest' --stacktrace

      - name: Focused Decision Intelligence tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.DecisionEngineTest' --stacktrace

      - name: Focused Quant Research tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.trading.AmarQuantResearchPlatformTest' --stacktrace

      - name: Focused Self-Critique tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarAgentCriticItemSixTest' --stacktrace

      - name: Full unit test suite
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: gradle :app:assembleDebug --stacktrace

      - name: Release build
        run: gradle :app:assembleRelease --stacktrace

      - name: Architecture and constitutional regression checks
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/governance/AMAR_PROJECT_CONSTITUTION.md
          grep -q '^\*\*Status: BINDING PROJECT LAW\*\*$' docs/governance/AMAR_PROJECT_CONSTITUTION.md
          test -f docs/governance/STAGE11_ERROR_PREVENTION_RULES.md

          test -f docs/verification/STAGE11_ITEM1_INTELLIGENCE_CORE.md
          test -f docs/verification/STAGE11_ITEM2_CONFIDENCE_ENGINE.md
          test -f docs/verification/STAGE11_ITEM3_EVIDENCE_QUALITY_SCORE.md
          test -f docs/verification/STAGE11_ITEM5_REBUILD_SCOPE.md
          test -f docs/verification/STAGE11_ITEM6_SELF_CRITIQUE_SCOPE.md

          test -f docs/architecture/STAGE11_ITEM3_TRUST_AND_BACKTEST_ROADMAP.md
          test -f docs/architecture/AMAR_TRADING_RECOMMENDATION_ARCHITECTURE_BASELINE.md
          test -f docs/architecture/AMAR_TRADING_RESEARCH_RECOMMENDATION_CONTRACT.md

          grep -q 'Evidence-to-Decision Traceability' docs/architecture/STAGE11_ITEM3_TRUST_AND_BACKTEST_ROADMAP.md
          grep -q '^## Canonical research flow
          grep -q 'AmarEvidenceQualityUpstreamState' docs/verification/STAGE11_ITEM3_EVIDENCE_QUALITY_SCORE.md
          grep -Pzoq 'if\s*\(\s*isFullyVerified\s*\(\s*item\s*\)\s*\)\s*1\.0\s*else\s*0\.0' app/src/main/java/com/personal/gridbot/amaros/agent/AmarEvidenceQualityScoreEngine.kt
          ! grep -qE '0\.[0-9]+.*\*|\*.*0\.[0-9]+' app/src/main/java/com/personal/gridbot/amaros/agent/AmarEvidenceQualityScoreEngine.kt

          test ! -f app/src/main/java/com/personal/gridbot/amaros/agent/AmarEvidenceQualityCertification.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/agent/AmarEvidenceQualityUpstreamState.kt
          test ! -f app/src/test/java/com/personal/gridbot/amaros/agent/AmarEvidenceQualityCertificationTest.kt
          test -f app/src/test/java/com/personal/gridbot/amaros/agent/AmarEvidenceQualityUpstreamStateTest.kt

          grep -q 'Stage 11 Item 1: CLOSED' docs/verification/STAGE11_ITEM1_INTELLIGENCE_CORE.md
          grep -q '^Status: CLOSED$' docs/verification/STAGE11_ITEM5_REBUILD_SCOPE.md
          grep -q '^Status: CLOSED$' docs/verification/STAGE11_ITEM6_SELF_CRITIQUE_SCOPE.md

          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/core/AmarIntelligenceCore.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/confidence/AmarConfidenceEngine.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/verification/AmarVerificationLayer.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/memory/AmarAdvancedMemory.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/research/AmarDeepResearchOrchestrator.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/DecisionEngine.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/agent/AmarAgentCritic.kt
          test -f app/src/main/java/com/personal/gridbot/amaros/intelligence/trading/AmarQuantResearchPlatform.kt

          test ! -f app/src/main/java/com/personal/gridbot/amaros/intelligence/decision/AmarDecisionEngine2.kt
          test ! -f app/src/test/java/com/personal/gridbot/amaros/intelligence/decision/AmarDecisionEngine2Test.kt

          # Stage 11 execution-safety gate.
          # Rewritten as a lexical token scan: comments and literals are skipped,
          # then only executable identifiers/operators are evaluated.
          python3 - <<'PY'
          from pathlib import Path

          ROOTS = [
              Path("app/src/main/java/com/personal/gridbot/amaros/intelligence/core"),
              Path("app/src/main/java/com/personal/gridbot/amaros/intelligence/verification"),
              Path("app/src/main/java/com/personal/gridbot/amaros/intelligence/memory"),
              Path("app/src/main/java/com/personal/gridbot/amaros/intelligence/research"),
          ]

          def tokens(source):
              result = []
              i = 0
              line = 1
              n = len(source)

              def add(kind, value, at):
                  result.append((kind, value, at))

              while i < n:
                  ch = source[i]

                  if ch == "\n":
                      line += 1
                      i += 1
                      continue

                  if source.startswith("//", i):
                      i += 2
                      while i < n and source[i] != "\n":
                          i += 1
                      continue

                  if source.startswith("/*", i):
                      i += 2
                      while i < n:
                          if source[i] == "\n":
                              line += 1
                              i += 1
                          elif source.startswith("*/", i):
                              i += 2
                              break
                          else:
                              i += 1
                      continue

                  if source.startswith('"""', i):
                      i += 3
                      while i < n:
                          if source[i] == "\n":
                              line += 1
                              i += 1
                          elif source.startswith('"""', i):
                              i += 3
                              break
                          else:
                              i += 1
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      while i < n:
                          if source[i] == "\n":
                              line += 1
                              i += 1
                          elif source[i] == "\\": 
                              i += 2
                          elif source[i] == quote:
                              i += 1
                              break
                          else:
                              i += 1
                      continue

                  if ch.isalpha() or ch == "_":
                      begin = i
                      i += 1
                      while i < n and (source[i].isalnum() or source[i] == "_"):
                          i += 1
                      add("id", source[begin:i], line)
                      continue

                  if ch in "=()":
                      add("op", ch, line)
                      i += 1
                      continue

                  i += 1

              return result

          def violations_for(path):
              ts = tokens(path.read_text(encoding="utf-8"))
              violations = []
              for i, (kind, value, line) in enumerate(ts):
                  if kind != "id":
                      continue

                  if value.lower() == "ordersend":
                      if i + 1 < len(ts) and ts[i + 1][1] == "(":
                          violations.append((line, "forbidden execution call"))
                      continue

                  if value in {"brokerAccessAllowed", "liveTrading", "executable"}:
                      if (
                          i + 2 < len(ts)
                          and ts[i + 1][1] == "="
                          and ts[i + 2][1].lower() == "true"
                      ):
                          violations.append((line, "forbidden enabled-execution assignment"))
              return violations

          files = [
              path
              for root in ROOTS
              if root.exists()
              for path in root.rglob("*.kt")
          ]

          violations = []
          for path in files:
              for line, reason in violations_for(path):
                  violations.append(f"{path}:{line}: {reason}")

          if violations:
              print("Stage 11 execution-safety violation:")
              print("\n".join(violations))
              raise SystemExit(1)

          print(f"Stage 11 execution-safety scan passed: {len(files)} Kotlin source files checked.")
          PY

          grep -q 'There are no heuristic weights, estimated percentages, averaging, or partial scores in Point 10.' docs/verification/STAGE11_ITEM3_EVIDENCE_QUALITY_SCORE.md

          grep -q 'AmarEvidenceQualityUpstreamState' docs/verification/STAGE11_ITEM3_EVIDENCE_QUALITY_SCORE.md
          grep -Pzoq 'if\s*\(\s*isFullyVerified\s*\(\s*item\s*\)\s*\)\s*1\.0\s*else\s*0\.0' app/src/main/java/com/personal/gridbot/amaros/agent/AmarEvidenceQualityScoreEngine.kt
