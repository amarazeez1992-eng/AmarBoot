name: AMAR AI Stage Two Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  stage-two:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Run Stage 2 regression tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarAgentStageTwoTest'

      - name: Run Point 6 Duplicate Evidence Detection boundary test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarDuplicateEvidenceDetectorTest'

      - name: Run Point 7 Fingerprint Integrity boundary test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarFingerprintIntegrityVerifierTest'

      - name: Run Point 8 Evidence Tampering boundary test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.intelligence.verification.AmarEvidenceTamperingDetectorTest'

      - name: Run full unit test suite
        run: gradle :app:testDebugUnitTest

      - name: Verify debug build
        run: gradle :app:assembleDebug
