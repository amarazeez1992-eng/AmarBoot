name: Amar Stage 8 — Central Command Plane

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  stage-eight-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Focused Stage 8 tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.command.AmarCentralCommandPlaneTest' --stacktrace

      - name: Full unit test suite
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Debug build verification
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: amar-stage-eight-diagnostics
          path: |
            app/build/reports/tests/**
            app/build/outputs/apk/**
          if-no-files-found: ignore
