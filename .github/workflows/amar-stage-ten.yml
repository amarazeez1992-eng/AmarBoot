name: Amar Stage 10 — Final 100% Audit and Release Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'mt5/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  pull_request:
    paths:
      - 'app/**'
      - 'mt5/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/**'
      - 'gradle/**'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-ten-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Regression and full unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Debug build verification
        run: gradle :app:assembleDebug --stacktrace
      - name: Release build verification
        run: gradle :app:assembleRelease --stacktrace
      - name: Release artifact verification
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          sha256sum "$apk"
          stat -c '%n %s bytes' "$apk"
      - name: Dependency graph audit
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --stacktrace > stage10-release-dependencies.txt
      - name: Dependency license and provenance audit
        shell: bash
        run: |
          set -euo pipefail
          ledger='docs/governance/THIRD_PARTY_DEPENDENCIES.md'
          gradle_file='app/build.gradle'
          test -s "$ledger"
          test -s "$gradle_file"
          grep -q 'Direct dependencies' "$ledger"
          grep -q 'Unknown, missing, or incompatible licensing is release-blocking' "$ledger"
          grep -q 'Transitive dependencies are not implicitly approved' "$ledger"
          grep -q 'androidx.core:core-ktx.*1.13.1' "$ledger"
          grep -q 'androidx.lifecycle:lifecycle-runtime-ktx.*2.8.2' "$ledger"
          grep -q 'androidx.room:room-runtime.*2.6.1' "$ledger"
          grep -q 'com.squareup.retrofit2:retrofit.*2.11.0' "$ledger"
          grep -q 'com.squareup.okhttp3:okhttp.*4.12.0' "$ledger"
          grep -q 'androidx.work:work-runtime-ktx.*2.9.0' "$ledger"
          grep -q 'junit:junit.*4.13.2' "$ledger"
          grep -q 'repository `LICENSE` (MIT)' "$ledger"
          if grep -nE "implementation ['\"][^:'\"]+:[^:'\"]+:([+*]|latest|release)|testImplementation ['\"][^:'\"]+:[^:'\"]+:([+*]|latest|release)" "$gradle_file"; then
            echo 'Dynamic dependency versions are not permitted.'
            exit 1
          fi
      - name: Comprehensive security audit
        shell: bash
        run: |
          set -euo pipefail
          echo '== Secret and credential pattern scan =='
          if git grep -nE 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,}|npm_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' -- ':!stage10-release-dependencies.txt'; then
            echo 'Potential credential pattern detected.'
            exit 1
          fi
          echo '== Android permission allowlist =='
          manifest='app/src/main/AndroidManifest.xml'
          test -s "$manifest"
          if grep -nE 'android.permission.(READ|WRITE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|CAMERA|READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|RECEIVE_SMS|READ_CALL_LOG|WRITE_CALL_LOG|CALL_PHONE|READ_PHONE_STATE|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW|MANAGE_EXTERNAL_STORAGE|QUERY_ALL_PACKAGES)' "$manifest"; then
            echo 'Unexpected high-risk Android permission detected.'
            exit 1
          fi
          echo '== Manifest security invariants =='
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'android:exported="true"' "$manifest"
          test "$(grep -c 'android:name=".MainActivity"' "$manifest")" -eq 1
          grep -q 'android:name=".GridBotService"' "$manifest"
          grep -q 'android:exported="false"' "$manifest"
          echo '== Source logging and live-network safety =='
          if git grep -nE 'HttpLoggingInterceptor|setLevel\([^)]*BODY|LoggingInterceptor' -- 'app/src/main'; then
            echo 'Verbose HTTP logging must not be present in the Android source.'
            exit 1
          fi
          if git grep -nE 'brokerAccessAllowed[[:space:]]*=[[:space:]]*true|liveTrading[[:space:]]*=[[:space:]]*true|OrderSend[[:space:]]*\(' -- 'app/src/main'; then
            echo 'Potential live execution path detected in Android source.'
            exit 1
          fi
          echo '== Network transport policy =='
          if git grep -nE 'http://[^[:space:]"<>()]+' -- 'app/src/main/**/*.kt' 'app/src/main/**/*.java' 'app/src/main/**/*.json' 'app/src/main/**/*.xml' ':!app/src/main/AndroidManifest.xml' ':!app/src/main/java/com/personal/gridbot/amaros/security/AmarSecurityContracts.kt' ':!app/src/main/java/com/personal/gridbot/amaros/sync/AmarSyncCenterScreen.kt'; then
            echo 'Cleartext HTTP endpoint detected in Android source.'
            exit 1
          fi
          echo '== Security documentation =='
          test -s SECURITY.md
          grep -q 'API keys and credentials must never be committed' SECURITY.md
          grep -q 'Live trading remains fail-closed' SECURITY.md
      - name: Canonical agent architecture audit
        shell: bash
        run: |
          set -euo pipefail
          engine='app/src/main/java/com/personal/gridbot/amaros/ai/AmarAiAgentEngine.kt'
          activity='app/src/main/java/com/personal/gridbot/MainActivity.kt'
          test -s "$engine"
          test -s "$activity"
          grep -q 'AmarAgentOrchestrator' "$engine"
          grep -q 'orchestrator.run' "$engine"
          grep -q 'executionAllowed = false' 'app/src/main/java/com/personal/gridbot/amaros/agent/AmarAgentOrchestrator.kt'
          grep -q 'brokerAccessAllowed = false' 'app/src/main/java/com/personal/gridbot/amaros/agent/AmarAgentOrchestrator.kt'
          if grep -n 'AmarLocalReasoning' "$activity"; then
            echo 'UI must not instantiate the local reasoning provider directly.'
            exit 1
          fi
          if grep -n 'AmarAgentCore(' "$activity"; then
            echo 'UI must not bypass the canonical Agent Orchestrator with AmarAgentCore.'
            exit 1
          fi
          echo 'Canonical UI → Agent boundary verified.'
      - name: Protected execution safety audit
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn --exclude-dir=.git 'liveTrading=false' . >/dev/null
          grep -RIn --exclude-dir=.git 'brokerAccessAllowed=false' app/src/main >/dev/null
      - name: Release hygiene checks
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s SECURITY.md
          test -s docs/OPEN_SOURCE_POLICY.md
          test -s docs/governance/ENGINEERING_REGRESSION_EXCLUSIONS.md
          test -s docs/governance/STAGE10_FINAL_AUDIT.md
          test -s docs/governance/THIRD_PARTY_DEPENDENCIES.md
      - name: Upload Stage 10 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: amar-stage-ten-audit-evidence
          path: |
            stage10-release-dependencies.txt
            app/build/reports/tests/**
            app/build/outputs/apk/release/**
          if-no-files-found: ignore

# Stage 10 dependency/license gate: verify the exact direct dependency ledger before release closure.
