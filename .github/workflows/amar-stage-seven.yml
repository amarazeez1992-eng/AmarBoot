name: AMAR AI Stage Seven Verification
concurrency:
  group: amar-amar-stage-seven.yml-main
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/personal/gridbot/amaros/governance/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/governance/**'
      - 'docs/governance/**'
  workflow_dispatch:

jobs:
  stage-seven:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Run Stage 7 focused tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.governance.AmarExecutionGovernanceTest' --stacktrace
      - name: Run full unit test suite
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build verification
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-test-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/apk/debug/**
          if-no-files-found: warn
