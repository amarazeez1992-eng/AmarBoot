name: AMAR AI Stage Five Verification
concurrency:
  group: amar-amar-stage-five.yml-main
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/personal/gridbot/amaros/**/AmarStageFive*'
      - 'app/src/test/java/com/personal/gridbot/amaros/**/AmarStageFive*'
  workflow_dispatch:

jobs:
  stage-five:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Run Stage 5 focused tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarStageFiveTest'
      - name: Run full unit test suite
        run: gradle :app:testDebugUnitTest
