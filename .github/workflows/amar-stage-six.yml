name: AMAR AI Stage Six Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  stage-six:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Run Stage 6 focused tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarStageSixTest'
      - name: Run full unit test suite
        run: gradle :app:testDebugUnitTest
