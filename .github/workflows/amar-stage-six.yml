name: AMAR AI Stage Six Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/personal/gridbot/amaros/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/**'
  workflow_dispatch:

concurrency:
  group: amar-amar-stage-six-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-six:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Run Stage 6 focused tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarStageSixTest' --stacktrace
      - name: Run full unit test suite
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-test-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
