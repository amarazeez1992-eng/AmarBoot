name: AMAR AI Stage Three Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  stage-three:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean tree
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Gradle toolchain
        run: gradle --version

      - name: Structural diff check
        run: git diff --check

      - name: Stage 3 reasoning and critic tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarStageThreeTest' --tests 'com.personal.gridbot.amaros.agent.AmarStageThreeReasoningTest' --stacktrace

      - name: Agent app integration regression
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.ai.AmarAiAgentEngineRuntimeTest' --stacktrace

      - name: Full unit regression
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: gradle :app:assembleDebug --stacktrace
