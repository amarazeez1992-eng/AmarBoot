name: AMAR AI Full Stage Audit

on:
  push:
    branches: [ stage10-11-final-implementation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  full-stage-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assert audited revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Verify strategy and provider boundaries
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s SECURITY.md
          test -s docs/governance/PROJECT_CLOSURE_PROTOCOL.md
          test -s docs/governance/STAGE10_FINAL_AUDIT.md
          test ! -f app/src/main/java/com/personal/gridbot/amaros/ai/AmarGeminiClient.kt
          test ! -f app/src/main/java/com/personal/gridbot/amaros/ai/AmarAiKeyStore.kt
          if grep -RniE 'AmarGeminiClient|AmarAiKeyStore|Gemini API Key|gemini-[0-9]' app/src/main/java; then
            echo 'Forbidden external-provider reference found in production source.'
            exit 1
          fi

      - name: Verify modern Agent and multimodal integration contracts
        run: |
          set -euo pipefail
          test -s app/src/main/assets/amar_reference.html
          test -s app/src/main/java/com/personal/gridbot/amaros/ai/AmarAiAgentWorkspaceScreen.kt
          test -s app/src/main/java/com/personal/gridbot/amaros/workspace/Item10NativeCameraTransport.kt
          test -s app/src/main/java/com/personal/gridbot/amaros/workspace/Item10NativeMediaTransport.kt
          test -s app/src/main/java/com/personal/gridbot/amaros/workspace/Item10VoiceRecorder.kt
          test -s app/src/main/java/com/personal/gridbot/amaros/workspace/Item10CaptureCoordinator.kt
          grep -q 'CAMERA' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' app/src/main/AndroidManifest.xml
          grep -q 'AmarAiAgentWorkspaceScreen()' app/src/main/java/com/personal/gridbot/amaros/navigation/AmarRoomHostScreen.kt
          grep -q 'MediaProjectionManager' app/src/main/java/com/personal/gridbot/amaros/workspace/Item10NativeMediaTransport.kt
          grep -q 'createVirtualDisplay' app/src/main/java/com/personal/gridbot/amaros/workspace/Item10NativeMediaTransport.kt
          grep -q 'CameraManager' app/src/main/java/com/personal/gridbot/amaros/workspace/Item10NativeCameraTransport.kt
          grep -q 'MediaRecorder' app/src/main/java/com/personal/gridbot/amaros/workspace/Item10VoiceRecorder.kt
          if test -f app/src/main/java/com/personal/gridbot/amaros/ai/AmarAiExperienceScreenV2.kt; then
            echo 'Legacy Agent workspace must not remain in the production source tree.'
            exit 1
          fi
          grep -q 'CENTRAL INTELLIGENCE' app/src/main/assets/amar_reference.html

      - name: Stage 1 focused test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarAgentStageOneTest' --stacktrace

      - name: Stage 2 focused test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarAgentStageTwoTest' --stacktrace

      - name: Stage 3 focused test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarStageThreeTest' --stacktrace

      - name: Stage 4 focused test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarStageFourTest' --stacktrace

      - name: Stage 5 focused test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarStageFiveTest' --stacktrace

      - name: Stage 6 focused test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarStageSixTest' --stacktrace

      - name: Stage 7 focused test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.governance.AmarExecutionGovernanceTest' --stacktrace

      - name: Stage 8 focused test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.command.AmarCentralCommandPlaneTest' --stacktrace

      - name: Stage 9 focused test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.workforce.AmarParallelWorkforceTest' --stacktrace

      - name: Full unit regression suite
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android debug build
        run: gradle :app:assembleDebug --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Final artifact presence check
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      # Governance: this workflow is intentionally a push-triggered final gate.
