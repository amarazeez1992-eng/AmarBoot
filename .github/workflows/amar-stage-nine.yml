name: Amar Stage Nine

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/personal/gridbot/amaros/workforce/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/workforce/**'
      - '.github/workflows/amar-stage-nine.yml'
  workflow_dispatch:

jobs:
  verify-stage-nine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Focused Stage 9 tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.workforce.AmarParallelWorkforceTest' --stacktrace

      - name: Full unit test suite
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Debug build verification
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: amar-stage-nine-diagnostics
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
