name: AMAR AI Stage Two Runtime Verification

on:
  workflow_dispatch:

jobs:
  stage-two-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Verify debug build
        run: gradle :app:assembleDebug --stacktrace
