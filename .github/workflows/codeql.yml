name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    if: matrix.language == 'java-kotlin' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin", "javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.7
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Initialize CodeQL for Java/Kotlin
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Initialize CodeQL for JavaScript/TypeScript
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Build Android application for CodeQL
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Gradle build attempt ${attempt}/${max_attempts}"
            if gradle clean assembleDebug --no-daemon --stacktrace; then
              echo "Gradle build succeeded on attempt ${attempt}."
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Gradle build failed after ${max_attempts} attempts."
              exit 1
            fi
            sleep_seconds=$((attempt * 30))
            echo "Transient dependency/network failure is possible; retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
