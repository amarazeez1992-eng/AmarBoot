name: Build APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'bridge/**'
      - 'gradle/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK and bridge verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Diagnose Android SDK environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager || true
          which sdkmanager || true
          sdkmanager --version || true
          java -version
          ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" || true

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Configure Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Python bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography>=42.0.0'
          python3 -m py_compile bridge/*.py
          python3 -m unittest discover bridge -p 'test_*.py' -v

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"

      - name: Validate Gradle model
        run: gradle --version

      - name: Clean
        run: gradle clean --no-daemon --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK installability and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"

          # Resolve a complete Android Build Tools installation instead of
          # assuming that a version directory implies that every verifier
          # executable is present and runnable.
          build_tools=""
          for candidate in             "$ANDROID_SDK_ROOT/build-tools/35.0.0"             "$ANDROID_HOME/build-tools/35.0.0"             "$ANDROID_SDK_ROOT/build-tools/34.0.0"             "$ANDROID_HOME/build-tools/34.0.0"; do
            if [ -x "$candidate/zipalign" ] &&
               [ -x "$candidate/apksigner" ] &&
               [ -x "$candidate/apkanalyzer" ]; then
              build_tools="$candidate"
              break
            fi
          done
          test -n "$build_tools"
          echo "Using Android Build Tools: $build_tools"
          "$build_tools/zipalign" -h >/dev/null
          "$build_tools/apksigner" --version
          "$build_tools/apkanalyzer" --help >/dev/null
          export PATH="$build_tools:$PATH"

          # Keep the official Android verification commands intact. Capture
          # each verifier's output and return code so a failed gate cannot
          # collapse into an uninformative exit-code-only annotation.
          set +e

          zipalign_log="$(mktemp)"
          zipalign -c -P 16 -v 4 "$apk" >"$zipalign_log" 2>&1
          zipalign_rc=$?
          cat "$zipalign_log"
          rm -f "$zipalign_log"
          if [ "$zipalign_rc" -ne 0 ]; then
            echo "zipalign verification failed with exit code $zipalign_rc"
            exit "$zipalign_rc"
          fi

          apksigner_log="$(mktemp)"
          apksigner verify --verbose "$apk" >"$apksigner_log" 2>&1
          apksigner_rc=$?
          cat "$apksigner_log"
          rm -f "$apksigner_log"
          if [ "$apksigner_rc" -ne 0 ]; then
            echo "apksigner verification failed with exit code $apksigner_rc"
            exit "$apksigner_rc"
          fi

          cert_log="$(mktemp)"
          apksigner verify --print-certs "$apk" >"$cert_log" 2>&1
          cert_rc=$?
          cat "$cert_log"
          rm -f "$cert_log"
          if [ "$cert_rc" -ne 0 ]; then
            echo "apksigner certificate verification failed with exit code $cert_rc"
            exit "$cert_rc"
          fi

          analyzer_log="$(mktemp)"
          apkanalyzer manifest application-id "$apk" >"$analyzer_log" 2>&1
          analyzer_rc=$?
          cat "$analyzer_log"
          if [ "$analyzer_rc" -ne 0 ]; then
            echo "apkanalyzer failed with exit code $analyzer_rc"
            rm -f "$analyzer_log"
            exit "$analyzer_rc"
          fi
          grep -Fx 'com.personal.gridbot' "$analyzer_log"
          grep_rc=$?
          rm -f "$analyzer_log"
          if [ "$grep_rc" -ne 0 ]; then
            echo "APK application-id verification failed with exit code $grep_rc"
            exit "$grep_rc"
          fi

          set -e
          sha256sum "$apk" | tee "$apk.sha256"
          ls -lh "$apk" "$apk.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GridTradeBot-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
