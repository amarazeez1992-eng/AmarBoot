name: Build APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'bridge/**'
      - 'gradle/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK and bridge verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Diagnose Android SDK environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager || true
          which sdkmanager || true
          sdkmanager --version || true
          java -version
          ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" || true

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Configure Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Python bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography>=42.0.0'
          python3 -m py_compile bridge/*.py
          python3 -m unittest discover bridge -p 'test_*.py' -v

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle model
        run: gradle --version

      - name: Clean
        run: gradle clean --no-daemon --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK installability and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          build_tools="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          if [ ! -d "$build_tools" ]; then
            build_tools="$ANDROID_HOME/build-tools/34.0.0"
          fi
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/apkanalyzer"
          export PATH="$build_tools:$PATH"

          # The APK currently contains no uncompressed native .so libraries.
          # Verify the canonical 4-byte APK entry alignment directly.
          # Do not use the deprecated -p page-alignment flag in the generic
          # verification gate; 16 KiB native-library verification is a
          # separate concern and requires -P 16 when such libraries exist.
          zipalign -c -v 4 "$apk"

          apksigner verify --verbose "$apk"
          apksigner verify --print-certs "$apk"
          apkanalyzer manifest application-id "$apk" | grep -Fx 'com.personal.gridbot'
          sha256sum "$apk" | tee "$apk.sha256"
          ls -lh "$apk" "$apk.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GridTradeBot-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
