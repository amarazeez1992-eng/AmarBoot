name: AMAR AI Stage One Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'app/build.gradle'
      - 'app/src/main/java/com/personal/gridbot/amaros/agent/AmarAgentCore*'
      - 'app/src/main/java/com/personal/gridbot/amaros/ai/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/logging/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/runtime/AmarOperationalDatabase.kt'
      - 'app/src/main/java/com/personal/gridbot/data/AppDatabase.kt'
      - 'app/src/main/java/com/personal/gridbot/amaros/config/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/modules/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/errors/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/version/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/environment/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/security/**'
      - 'app/src/main/java/com/personal/gridbot/network/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/config/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/modules/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/errors/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/version/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/environment/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/memory/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/knowledge/**'
      - 'app/src/main/java/com/personal/gridbot/amaros/explainability/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/agent/AmarAgentCore*'
      - 'app/src/test/java/com/personal/gridbot/amaros/ai/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/logging/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: amar-amar-stage-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-one:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Generate Room schemas
        run: gradle :app:kspDebugKotlin --stacktrace

      - name: Commit Room schemas if changed
        run: |
          if [ -d app/schemas ] && [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "chore: auto-commit Room schemas [skip ci]"
            git push
          fi

      - name: Run Stage 1 core tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarAgentCoreRuntimeTest' --stacktrace

      - name: Run Stage 1 engine integration test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.ai.AmarAiAgentEngineRuntimeTest' --stacktrace

      - name: Run Stage 1 logging tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.logging.AmarLoggerTest' --stacktrace

      - name: Run full AMAR AI agent unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify debug build
        run: gradle :app:assembleDebug --stacktrace
