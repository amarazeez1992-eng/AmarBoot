name: AMAR AI Stage One Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  stage-one:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Run Stage 9 focused tests
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.workforce.AmarParallelWorkforceTest' --stacktrace

      - name: Run full AMAR AI agent unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify debug build
        run: gradle :app:assembleDebug --stacktrace
