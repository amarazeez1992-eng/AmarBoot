name: AMAR Agent Stage 1

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ stage10-11-final-implementation ]

jobs:
  agent-stage1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify external-provider removal
        shell: bash
        run: |
          test ! -f app/src/main/java/com/personal/gridbot/amaros/ai/AmarGeminiClient.kt
          test ! -f app/src/main/java/com/personal/gridbot/amaros/ai/AmarAiKeyStore.kt
          if grep -RniE 'AmarGeminiClient|AmarAiKeyStore|Gemini API Key|gemini-[0-9]' app/src/main/java; then
            echo 'Forbidden external-provider reference found in production source.'
            exit 1
          fi

      - name: Install Gradle 8.7
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Agent unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android debug build
        run: gradle --no-daemon assembleDebug
