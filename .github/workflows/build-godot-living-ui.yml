name: Build AMAR Living UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot_ui/**'
      - '.github/workflows/build-godot-living-ui.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Godot 4.5.2
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.5.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Install Godot export templates
        run: |
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz
          unzip -q templates.tpz -d templates_unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          cp -R templates_unpack/templates/. "$HOME/.local/share/godot/export_templates/4.5.2.stable/"

      - name: Validate Godot project
        run: ./godot --headless --path godot_ui --editor --quit --check-only

      - name: Export Android APK
        id: export_apk
        continue-on-error: true
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.HOME }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p godot_ui/build
          cd godot_ui
          set +e
          ../godot --headless --path . --export-debug "Android" build/AmarLivingUI-debug.apk 2>&1 | tee godot_export.log
          status=${PIPESTATUS[0]}
          echo "GODOT_EXPORT_EXIT_CODE=$status" >> godot_export.log
          exit $status

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmarLivingUI-export-diagnostics
          path: godot_ui/godot_export.log
          if-no-files-found: warn

      - name: Fail if APK export failed
        if: steps.export_apk.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarLivingUI-debug-apk
          path: godot_ui/build/AmarLivingUI-debug.apk
          if-no-files-found: error
