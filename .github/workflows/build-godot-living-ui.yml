name: Build AMAR Living UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot_ui/**'
      - '.github/workflows/build-godot-living-ui.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Download Godot 4.5.2
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.5.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Install Godot export templates
        run: |
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz
          unzip -q templates.tpz -d templates_unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          cp -R templates_unpack/templates/. "$HOME/.local/share/godot/export_templates/4.5.2.stable/"
          printf '%s\n' '4.5.2.stable' > "$HOME/.local/share/godot/export_templates/4.5.2.stable/version.txt"
          test -f "$HOME/.local/share/godot/export_templates/4.5.2.stable/android_debug.apk"

      - name: Validate project and scripts
        run: ./godot --headless --path godot_ui --editor --quit --check-only

      - name: Export Android APK
        run: |
          mkdir -p godot_ui/build
          cd godot_ui
          set -o pipefail
          ../godot --headless --path . --export-debug "Android" build/AmarLivingUI-debug.apk 2>&1 | tee godot_export.log
          test -s build/AmarLivingUI-debug.apk

      - name: Verify APK
        run: |
          test -f godot_ui/build/AmarLivingUI-debug.apk
          stat -c '%n %s bytes' godot_ui/build/AmarLivingUI-debug.apk

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmarLivingUI-export-diagnostics
          path: godot_ui/godot_export.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarLivingUI-debug-apk
          path: godot_ui/build/AmarLivingUI-debug.apk
          if-no-files-found: error
