name: AMAR AI Stage Zero Verification

on:
  push:
    branches: [ stage0-verification ]

jobs:
  stage-zero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Stage 0 foundation runtime test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.AmarAgentCoreRuntimeTest' --stacktrace
      - name: Stage 0 app integration test
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.ai.AmarAiAgentEngineRuntimeTest' --stacktrace
      - name: Stage 0 full unit regression
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Stage 0 debug build
        run: gradle :app:assembleDebug --stacktrace
