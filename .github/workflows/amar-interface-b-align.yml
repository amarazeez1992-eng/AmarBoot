name: Align Interface B
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Align Interface B
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/personal/gridbot/amaros/bots/AmarBotLabInterfaceBScreenV2.kt')
          s=p.read_text()
          old='''            item { AmarBotLabGlobalContext() }\n            item { BotSelector(selectedBot, onBotSelected) }\n            item { StrategySelector(selectedStrategy) { selectedStrategy = it } }'''
          new='''            item { AmarBotLabGlobalContext() }\n            item { BotSelector(selectedBot, onBotSelected) }\n            item { BotManagementControls(repo) { bots = repo.load() } }\n            item { StrategySelector(selectedStrategy) { selectedStrategy = it } }'''
          if old not in s:
              raise SystemExit('expected Interface B selector block not found')
          s=s.replace(old,new,1)
          marker='''@Composable\nprivate fun StrategySelector'''
          block='''@Composable\nprivate fun BotManagementControls(\n    repo: AmarBotVaultRepository,\n    onChanged: () -> Unit\n) {\n    Card(colors = CardDefaults.cardColors(containerColor = B1)) {\n        Row(\n            Modifier.fillMaxWidth().padding(9.dp),\n            horizontalArrangement = Arrangement.spacedBy(6.dp)\n        ) {\n            Button(\n                onClick = { repo.addBot(); onChanged() },\n                modifier = Modifier.weight(1f),\n                colors = ButtonDefaults.buttonColors(containerColor = BC, contentColor = Color.Black)\n            ) { Text("+ إضافة بوت", fontSize = 9.sp, fontWeight = FontWeight.Black) }\n            Button(\n                onClick = { repo.addBot(); onChanged() },\n                modifier = Modifier.weight(1f),\n                colors = ButtonDefaults.buttonColors(containerColor = BG, contentColor = Color.Black)\n            ) { Text("إنشاء بوت", fontSize = 9.sp, fontWeight = FontWeight.Black) }\n        }\n    }\n}\n\n'''
          if 'private fun BotManagementControls(' not in s:
              if marker not in s:
                  raise SystemExit('strategy marker not found')
              s=s.replace(marker,block+marker,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/personal/gridbot/amaros/bots/AmarBotLabInterfaceBScreenV2.kt
          git diff --cached --quiet || git commit -m 'Complete Interface B shared bot controls'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/amar-interface-b-align.yml
          git add .github/workflows/amar-interface-b-align.yml
          git diff --cached --quiet || git commit -m 'Remove temporary alignment workflow'
          git push