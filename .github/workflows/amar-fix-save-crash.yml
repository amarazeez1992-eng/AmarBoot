name: Fix strategy save defaults
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/amar-fix-save-crash.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch Interface B defaults
        shell: bash
        run: |
          set -euo pipefail
          f='app/src/main/java/com/personal/gridbot/amaros/bots/AmarBotLabInterfaceBScreenV2.kt'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/personal/gridbot/amaros/bots/AmarBotLabInterfaceBScreenV2.kt')
          s=p.read_text()
          replacements={
            'strategy?.profile?.lot ?: 0.0':'strategy?.profile?.lot ?: 0.01',
            'strategy?.profile?.multiplier ?: 0.0':'strategy?.profile?.multiplier ?: 2.0',
            'strategy?.profile?.gridStep ?: 0.0':'strategy?.profile?.gridStep ?: 30.0',
            'strategy?.profile?.maxOrders ?: 0':'strategy?.profile?.maxOrders ?: 10',
            'strategy?.profile?.basketTp ?: 0.0':'strategy?.profile?.basketTp ?: 50.0',
            'strategy?.profile?.basketSl ?: 0.0':'strategy?.profile?.basketSl ?: -30.0',
            'strategy?.profile?.buyEnabled ?: false':'strategy?.profile?.buyEnabled ?: true',
            'strategy?.profile?.sellEnabled ?: false':'strategy?.profile?.sellEnabled ?: true',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          s=s.replace('maxOrders = maxOrders.toInt().coerceAtLeast(0),','maxOrders = maxOrders.toInt().coerceAtLeast(1),')
          p.write_text(s)
          PY
          rm -f .github/workflows/amar-fix-save-crash.yml
          git config user.name 'amarazeez1992-eng'
          git config user.email 'amarazeez1992@gmail.com'
          git add app/src/main/java/com/personal/gridbot/amaros/bots/AmarBotLabInterfaceBScreenV2.kt .github/workflows/amar-fix-save-crash.yml
          git commit -m 'Fix Interface B strategy save crash defaults'
          git push
