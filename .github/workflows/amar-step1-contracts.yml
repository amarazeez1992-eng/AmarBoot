name: AMAR Step 1 Contracts

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/personal/gridbot/amaros/agent/admission/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/agent/admission/**'
      - '.github/workflows/amar-step1-contracts.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/personal/gridbot/amaros/agent/admission/**'
      - 'app/src/test/java/com/personal/gridbot/amaros/agent/admission/**'
      - '.github/workflows/amar-step1-contracts.yml'
  workflow_dispatch:

jobs:
  step1-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Run AdmissionContractsTest
        run: gradle :app:testDebugUnitTest --tests 'com.personal.gridbot.amaros.agent.admission.AdmissionContractsTest' --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step1-contracts-test-results
          path: app/build/test-results/testDebugUnitTest/
