plugins {
    id 'com.android.application' version '8.5.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    id 'org.jetbrains.kotlin.kapt' version '1.9.24' apply false
}


// TEMPORARY BUILD DIAGNOSTIC: expose source/compiler errors hidden behind kapt's generic module error.
// Remove after the underlying compilation error is fixed.
subprojects { subproject ->
    subproject.tasks.matching { it.name.contains("kapt", ignoreCase = true) }.configureEach {
        enabled = false
    }
}
