<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عمار AI — الواجهة رقم اثنين</title>
<style>
:root{--gold-1:#f8ecc0;--gold-2:#dcb254;--gold-3:#8f6415;--teal-1:#1fcf9a;--teal-2:#0a3d38;--green-1:#38dd85;--px:.5;--py:.5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;background:#03070a;overflow:hidden;font-family:'Tajawal','Cairo',sans-serif;color:#eef7f6}
#app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}
.bg{position:absolute;inset:-8%;z-index:0;background:radial-gradient(ellipse 55% 30% at 50% 3%,rgba(248,236,192,.13),transparent 60%),radial-gradient(ellipse 60% 45% at 10% 80%,rgba(31,207,154,.09),transparent 65%),radial-gradient(ellipse 60% 45% at 90% 82%,rgba(90,168,244,.08),transparent 65%),linear-gradient(180deg,#03060a 0%,#071620 42%,#0a1d2a 72%,#04090d 100%);transform:translate(calc((var(--px) - .5)*-12px),calc((var(--py) - .5)*-8px));transition:transform .25s ease-out}
canvas#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.topbar{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 14px 4px}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:11px;background:linear-gradient(155deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(220,178,84,.26);backdrop-filter:blur(16px) saturate(140%);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green-1);box-shadow:0 0 6px var(--green-1),0 0 12px var(--green-1);animation:pulseDot 1.9s ease-in-out infinite}.pill .sep{width:1px;height:13px;background:rgba(255,255,255,.14)}.pill span{color:#dcece9;font-weight:600;white-space:nowrap;font-size:11px}.pill b{color:var(--gold-1);font-weight:800}
.hero{position:relative;z-index:5;text-align:center;margin-top:.8vh;overflow:hidden}.logo-wrap{position:relative;width:82px;height:82px;margin:0 auto 2px}.halo{position:absolute;inset:-16px;border-radius:50%;filter:blur(9px);opacity:.75;background:conic-gradient(from 0deg,rgba(220,178,84,0),rgba(220,178,84,.55),rgba(31,207,154,.45),rgba(220,178,84,0));animation:rotateHalo 6s linear infinite}.logo{position:relative;z-index:2;width:82px;height:82px;filter:drop-shadow(0 6px 16px rgba(220,178,84,.4));animation:floatY 5.2s ease-in-out infinite}.brand{font-family:'Cairo','Tajawal',sans-serif;font-weight:900;font-size:38px;line-height:1;margin:0;background:linear-gradient(180deg,#fff8e4 0%,var(--gold-1) 22%,var(--gold-2) 55%,var(--gold-3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.tagline{font-size:12.5px;color:#b9d5d1;font-weight:700;margin-top:1px}.badge{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 14px;border-radius:999px;font-size:10.5px;font-weight:800;color:#bdf3d3;border:1px solid rgba(56,221,133,.45);background:rgba(56,221,133,.07)}
.stage3d{position:relative;z-index:3;width:min(96vw,500px);aspect-ratio:1/1;margin:0 auto;touch-action:none}#globeCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;cursor:grab}#nodesLayer{position:absolute;inset:0;z-index:2;pointer-events:none}#beams{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}.node3d{position:absolute;top:0;left:0;width:74px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto;cursor:pointer}.node3d .circle{width:54px;height:54px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 34% 28%,rgba(var(--c),.95),rgba(var(--c),.35) 55%,rgba(5,12,15,.92) 100%);border:1px solid rgba(255,255,255,.22);box-shadow:0 0 20px rgba(var(--c),.55),inset 0 0 12px rgba(255,255,255,.1),0 6px 14px rgba(0,0,0,.4)}.node3d .circle svg{width:23px;height:23px}.node3d .label{font-size:10px;font-weight:800;color:#f1faf8;white-space:nowrap;background:rgba(4,12,16,.6);border:1px solid rgba(255,255,255,.08);padding:2px 9px;border-radius:999px}.navdock{position:absolute;z-index:6;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:8px 10px;border-radius:26px;background:linear-gradient(155deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(220,178,84,.22);backdrop-filter:blur(18px) saturate(150%);box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}.navitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8fa7a4;font-size:9.5px;font-weight:700;width:52px;height:46px;border-radius:18px}.navitem.active{color:#04211c;background:linear-gradient(155deg,#4be9b8,var(--teal-2));box-shadow:0 4px 14px rgba(31,207,154,.45)}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.35)}}@keyframes rotateHalo{to{transform:rotate(360deg)}}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</head>
<body>
<div id="app"><div class="bg"></div><canvas id="stars"></canvas><div class="topbar"><div class="pill"><span class="dot"></span><span>عمار متصل</span><span class="sep"></span><span>الحساب تجريبي</span></div><div class="pill"><b>XAUUSD</b><span class="sep"></span><span>M5</span></div><div class="pill">⚙</div></div><div class="hero"><div class="logo-wrap"><div class="halo"></div><svg class="logo" viewBox="0 0 100 100"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff8e4"/><stop offset="45%" stop-color="#e9c877"/><stop offset="100%" stop-color="#8f6415"/></linearGradient></defs><path d="M50 8 C28 8 12 26 12 48 C12 66 24 80 40 85" fill="none" stroke="url(#gA)" stroke-width="6" stroke-linecap="round"/><path d="M50 88 L28 88 L58 30 L66 46 L48 82 Z" fill="url(#gA)"/><path d="M60 34 L82 16 L76 28 L88 24" fill="none" stroke="url(#gA)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="brand">عمار</div><div class="tagline">منصة التداول الذكية</div><div class="badge">◆ تجريبي ◆</div></div><div class="stage3d" id="stage3d"><canvas id="globeCanvas"></canvas><svg id="beams"></svg><div id="nodesLayer"></div></div><div class="navdock"><div class="navitem">الإعدادات</div><div class="navitem">التنبيهات</div><div class="navitem active">الرئيسية</div><div class="navitem">الأداء</div><div class="navitem">المزيد</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SAT_DATA=[{key:'market',name:'السوق',color:'31,207,154'},{key:'chart',name:'الرسم البياني',color:'90,168,244'},{key:'risk',name:'المخاطر',color:'232,162,58'},{key:'analysis',name:'التحليل',color:'185,140,245'},{key:'bot',name:'البوت',color:'56,221,133'}];
const nodesLayer=document.getElementById('nodesLayer');SAT_DATA.forEach(d=>{const el=document.createElement('div');el.className='node3d';el.style.setProperty('--c',d.color);el.innerHTML=`<div class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="#f4fffb" stroke-width="2"><circle cx="12" cy="12" r="7"/></svg></div><div class="label">${d.name}</div>`;nodesLayer.appendChild(el)});
const c=document.getElementById('stars'),ctx=c.getContext('2d');function resize(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',resize);resize();(function stars(){ctx.clearRect(0,0,c.width,c.height);for(let i=0;i<70;i++){const x=(i*97)%c.width,y=(i*53)%c.height;ctx.fillStyle='rgba(255,244,214,.35)';ctx.fillRect(x,y,1,1)}requestAnimationFrame(stars)})();
if(typeof THREE!=='undefined'){const canvas=document.getElementById('globeCanvas'),r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,.1,100);cam.position.z=4.6;const g=new THREE.Group();s.add(g);g.add(new THREE.Mesh(new THREE.SphereGeometry(.66,40,40),new THREE.MeshBasicMaterial({color:0x0a2f2b,transparent:true,opacity:.92})));const ring=new THREE.Mesh(new THREE.TorusGeometry(1.42,.007,8,128),new THREE.MeshBasicMaterial({color:0xdcb254,transparent:true,opacity:.28}));ring.rotation.x=1.15;g.add(ring);function rs(){const w=canvas.clientWidth,h=canvas.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();function a(){g.rotation.y+=.0016;ring.rotation.z+=.0007;r.render(s,cam);requestAnimationFrame(a)}a()}
</script></body></html>
